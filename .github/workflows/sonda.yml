name: Sonda RFFM (solo lectura)
on:
  workflow_dispatch:
    inputs:
      grupo:
        description: "Grupo RFFM"
        default: "28125503"
      ronda:
        description: "Jornada ya jugada, con partidos"
        default: "1"
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sonda-rffm.mjs
        env:
          GRUPO: ${{ inputs.grupo }}
          RONDA: ${{ inputs.ronda }}
