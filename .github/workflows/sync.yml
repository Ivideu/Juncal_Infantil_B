name: Sync resultados RFFM
on:
  workflow_dispatch:           # ejecución manual = revisión completa de las 22 jornadas
  schedule:
    # Una vez por hora, todos los días. Minuto 7 (y no el 0) porque GitHub retrasa o se salta
    # bastantes ejecuciones programadas justo a en punto, que es cuando hay más carga.
    # Va en UTC y cubre invierno y verano; el script solo actúa de 9:00 a 22:59 hora de Madrid.
    - cron: "7 7-21 * * *"
    # --- Alternativa si prefieres que solo corra de sábado a martes (quita el de arriba y activa este) ---
    # - cron: "7 7-21 * * 6,0,1,2"
concurrency:
  group: sync-rffm
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SOLO_CERRADAS: "0"       # "1" = solo resultados con el acta cerrada; "0" = también los de partidos ya terminados aunque el acta siga abierta
          ESPERA_MIN: "100"        # con SOLO_CERRADAS=0: minutos desde la hora de inicio antes de dar el resultado por bueno
          RESULTADO_PROPIO: "1"    # "1" = rellena el resultado de los partidos del Juncal B si tú no lo has puesto; "0" = nunca
