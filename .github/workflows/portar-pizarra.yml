name: Portar Login y Pizarra

# Copia el login (con acceso de administrador), la pestaña Jugadas y la Pizarra de Categorias/InfantilB.html
# a todas las demás categorías. Las que ya lo tienen no se tocan.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Portar a todas las categorías
        run: |
          for f in Categorias/*.html; do
            case "$f" in
              *InfantilB*) continue ;;
            esac
            python3 scripts/portar_login_pizarra.py Categorias/InfantilB.html "$f" "$f"
          done

      - name: Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Portar login y pizarra a las categorías"
          branch: main
