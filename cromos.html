<html lang="es">
<head>

<title>Juncal B · Primera Infantil FS G2 · 2026-27</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ff;--bg2:#ffffff;--card:rgba(255,255,255,.86);--line:#d5def5;--tx:#0f1b3d;--mu:#5a6a93;--ac:#2f7bff;--ye:#ffd23f;--ye2:#d97706;--ok:#22c55e;--ko:#ef4444;--dr:#f59e0b}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:80px}
h1,h2,.cn{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
.wrap{max-width:980px;margin:auto;padding:0 16px}
/* ===== Fondo animado ===== */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#f4f8ff,#e6efff 55%,#fff7e0)}
#bg i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.6;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
#bg i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:#8bbcff}
#bg i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:8vh;background:#ffe48a;animation-duration:30s;animation-delay:-8s}
#bg i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-24vmax;background:#a6f1c8;animation-duration:27s;animation-delay:-14s}
#bg i:nth-child(4){width:34vmax;height:34vmax;right:12vw;bottom:-10vmax;background:#c7b8ff;animation-duration:34s;animation-delay:-4s;opacity:.45}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.15)}100%{transform:translate(-6vw,12vh) scale(.95)}}
#bg:before{content:"";position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;margin:-39vmin 0 0 -39vmin;border-radius:50%;border:3px solid #2f7bff22;animation:pulse 9s ease-in-out infinite}
#bg:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#2f7bff14}
@keyframes pulse{50%{transform:scale(1.12);border-color:#2f7bff12}}
#bg b{position:absolute;bottom:-70px;font-weight:400;opacity:.2;will-change:transform;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(720deg)}}
/* ===== Cabecera ===== */
header{padding:28px 0 8px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;line-height:1;color:#0f2a6b}
header small{color:var(--mu);display:block;margin-top:6px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:8px 14px;border-radius:10px;transition:.2s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.on{background:var(--ac);border-color:var(--ac);color:#fff}
#hero{--tx:#eef2ff;--mu:#c3d0ff;--bg:#0a0f1e;--bg2:#121a33;--line:#33417a;--ye2:#ffd23f;color:#fff;margin:18px 0;padding:26px;border-radius:22px;background:linear-gradient(135deg,#3d8bff,#1e4fd8 55%,#0f2a78);border:1px solid #7aa9ff;box-shadow:0 14px 40px #1e4fd833;position:relative;overflow:hidden}
#hero>*{position:relative;z-index:1}
#hero:after{pointer-events:none;content:"⚽";position:absolute;right:-20px;bottom:-50px;font-size:200px;opacity:.1;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hv{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:14px 0;text-align:center}
.hv .cn{font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:700;max-width:220px}
.cd{display:flex;gap:10px;justify-content:center}.cd div{background:#0a1f5a66;border-radius:12px;padding:8px 14px;min-width:64px;text-align:center}
.cd b{font:800 2rem 'Barlow Condensed';display:block;line-height:1}.cd span{font-size:.75rem;color:var(--mu)}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px;position:sticky;top:0;z-index:5; justify-content: center;}
nav button{white-space:nowrap;font-weight:600}
nav button span:first-child{margin-right:6px}
@media(max-width:640px){
 nav{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
 nav.x{position:static}
 nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;min-width:0;white-space:normal;text-align:center;line-height:1.15;font-size:clamp(.62rem,3vw,.8rem)}
 nav button span:first-child{margin:0;font-size:1.3rem}
}
@media(max-width:340px){nav{grid-template-columns:repeat(2,1fr)}}
.b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font:800 1rem 'Barlow Condensed';color:#fff;flex:none;border:2px solid #fff;box-shadow:0 2px 8px #0f1b3d33}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 18px #1e4fd814;animation:in .5s both;animation-delay:calc(var(--i)*30ms)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card.me{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 8px 30px #2f7bff29}
.card.rw{background:linear-gradient(#22c55e38,#22c55e22),var(--card);border-color:#22c55e;box-shadow:0 8px 30px #22c55e26}
.card.rd{background:linear-gradient(#fde68a66,#fde68a40),var(--card);border-color:#e9c94f;box-shadow:0 8px 30px #fde68a33}
.card.rl{background:linear-gradient(#f8717140,#f8717126),var(--card);border-color:#f87171;box-shadow:0 8px 30px #f8717126}
.card.rest{opacity:.65}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.dt{background:var(--ye);color:#0a0f1e;font-weight:800;padding:2px 10px;border-radius:6px}
.dtb{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.4rem,5.2vw,2.5rem);padding:6px 22px;border-radius:12px;line-height:1.2;box-shadow:0 6px 24px #ffd23f55}
.top b{color:var(--ye2);font-family:'Barlow Condensed';font-size:1.1rem}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tm{display:flex;align-items:center;gap:10px;font-weight:600;line-height:1.2}
.tm.r{flex-direction:row-reverse;text-align:right}
.sc{font:800 1.8rem 'Barlow Condensed';background:#e3ebff;color:var(--tx);border-radius:10px;padding:2px 14px;min-width:88px;text-align:center}
.sc.t{font-size:1.3rem;color:var(--ac)}
.w{background:#22c55e2e;color:#15803d}.l{background:#ef44442e;color:#b91c1c}.d{background:#f59e0b2e;color:#b45309}
.pill{font:700 .8rem 'Barlow Condensed';padding:1px 10px;border-radius:99px;letter-spacing:.05em}
.meta{margin-top:10px;font-size:.88rem;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:#1d5fe0}
.ed{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap;align-items:center}
body.edit .ed{display:flex}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
body:not(.edit) input{background:#fff}
input.g{width:52px;text-align:center}
table{width:100%;border-collapse:collapse;background:var(--card);backdrop-filter:blur(8px);border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #1e4fd814}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:500;font-size:.8rem;background:#e9f0ff}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{background:#2f7bff26;font-weight:700}
.gap{color:var(--mu)}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ch button{padding:6px 11px;min-width:42px}
.jsel{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;max-width:420px}
.jsel select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;font:700 1rem Barlow,system-ui,sans-serif;color:var(--tx);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%232f7bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 14px center/12px;border:2px solid var(--ac);border-radius:12px;padding:10px 38px 10px 16px;text-align:center;text-align-last:center;cursor:pointer;box-shadow:0 4px 18px #2f7bff29}
.jsel button{flex:none;width:44px;height:44px;padding:0;font-size:1.5rem;line-height:1;font-weight:700;border-radius:12px}
.jsel button:disabled{opacity:.35;cursor:default;transform:none}
.jsel select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ye));transition:width 1s}
.gl{display:grid;grid-template-columns:30px 1fr 40px;gap:12px;align-items:center;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#adm{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--ac);padding:10px;justify-content:center;gap:8px;flex-wrap:wrap;z-index:9;box-shadow:0 -6px 24px #1e4fd822}
body.edit #adm{display:flex}
select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px}.gc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%}.gc button{padding:3px 10px;font-size:.85rem}
.live{text-align:center}.lt{font:700 1.15rem 'Barlow Condensed';letter-spacing:.06em;color:var(--ye)}
.lb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0}.lb .cn{font-size:clamp(1rem,3.6vw,1.7rem);font-weight:700}
.big{font:800 clamp(3.2rem,15vw,6.5rem)/1 'Barlow Condensed';background:#0a1f5a73;border-radius:18px;padding:4px 22px;white-space:nowrap}
.lclk{font:800 clamp(2.2rem,9vw,3.4rem)/1 'Barlow Condensed';background:var(--ye);color:#0a0f1e;display:inline-block;border-radius:12px;padding:4px 22px;box-shadow:0 6px 24px #ffd23f44}
.pb{display:flex;gap:8px;max-width:420px;margin:14px auto 0}.pb div{flex:1;height:8px;background:#0a1f5a66;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ye);width:0;transition:width 1s linear}
.lg{margin-top:14px}.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.g2 button{font-size:1.05rem;font-weight:700;padding:12px 16px;flex:1;min-width:140px}.g2 button:first-child{background:var(--ac);border-color:var(--ac)}
.gl2{display:inline-flex;align-items:center;gap:8px}.gl2 .mi{font:800 1.2rem 'Barlow Condensed';color:var(--ye2);min-width:36px;text-align:right}.gl2 .gn{color:var(--tx);font-weight:600;font-size:1.05rem}
.gls{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:4px}.lg>div{margin-top:6px}
.loc{text-align:center;margin:0 0 16px}.loc a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}.loc a:hover{color:var(--ye)}
.fsb{font-weight:600}
#hero.fs{--k:1;position:fixed;inset:0;z-index:100;margin:0;border:0;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 18px 6px;background:radial-gradient(900px 500px at 50% 0,#1d3a8a,#050b1f);overflow:hidden;display:flex}
#hero.fs.adm{--k:.74}
#hero.fs.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#hero.fs .live{height:100%;width:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
#hero.fs .lt{font-size:calc(var(--u)*6*var(--k))}
#hero.fs .lb{width:100%;max-width:1100px;margin:calc(var(--u)*1.5*var(--k)) 0}
#hero.fs .lb .cn{font-size:calc(var(--u)*7*var(--k))}
#hero.fs .b{width:calc(var(--u)*16*var(--k));height:calc(var(--u)*16*var(--k));font-size:calc(var(--u)*6*var(--k))}
#hero.fs .big{font-size:calc(var(--u)*32*var(--k));padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*4)}
#hero.fs .lclk{font-size:calc(var(--u)*13*var(--k));padding:calc(var(--u)*.5) calc(var(--u)*6)}
#hero.fs .pb{width:70%;max-width:none;margin-top:calc(var(--u)*2*var(--k))}
#hero.fs .lg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--gr,2),auto);justify-content:center;column-gap:calc(var(--u)*4);row-gap:calc(var(--u)*.8);width:100%;margin-top:calc(var(--u)*2*var(--k));font-size:calc(var(--u)*5*var(--gs,1)*var(--k))}
#hero.fs .lg>b,#hero.fs .loc{display:none}
#hero.fs .lg>div{margin:0}
#hero.fs .gl2{gap:calc(var(--u)*1.6*var(--gs,1))}
#hero.fs .gl2 svg{width:calc(var(--u)*7*var(--gs,1)*var(--k));height:auto}
#hero.fs .gl2 .mi{font-size:calc(var(--u)*6*var(--gs,1)*var(--k));min-width:0}
#hero.fs .gl2 .gn{font-size:calc(var(--u)*5*var(--gs,1)*var(--k))}
#hero.fs .admw{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.2);width:100%;margin-top:calc(var(--u)*2)}
#hero.fs .admw .ctl{display:contents}
#hero.fs .admw button,#hero.fs .admw select{font-size:calc(var(--u)*3.6);padding:calc(var(--u)*1.1) calc(var(--u)*2.2);min-width:0;flex:none;width:auto!important;max-width:none!important}
#hero.fs .xb{position:absolute;top:0;right:0;z-index:2}
.dot{animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
@media(max-width:560px){.mt{grid-template-columns:1fr auto 1fr}.tm{flex-direction:column;text-align:center!important;gap:4px;font-size:.85rem}.sc{min-width:70px;font-size:1.5rem}.b{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Jugadores ===== */
.cards-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.cards-head h2{font-size:2rem;color:#0f2a6b}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.player-card{position:relative;isolation:isolate;overflow:hidden;min-height:340px;aspect-ratio:2/3;border-radius:18px;background:linear-gradient(145deg,#0b1735,#1748a4 52%,#071126);border:1px solid #8ab5ff;box-shadow:0 12px 28px #071b4b38;color:white;cursor:pointer;transition:transform .2s,box-shadow .2s}
.player-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px #071b4b55}
.player-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,#69b6ff66,transparent 42%),linear-gradient(0deg,#030817 0%,transparent 55%);z-index:-1}
.player-card .avatar-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:-2}
.player-card .pc-top{display:flex;justify-content:space-between;align-items:start;padding:12px;gap:8px}
.pc-crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dbe8ff);border:2px solid #ffd23f;color:#12336f;font:800 12px 'Barlow Condensed';text-align:center;box-shadow:0 2px 10px #0005}
.pc-season{font:700 .7rem 'Barlow Condensed';letter-spacing:.08em;text-align:right;color:#dbeafe}
.pc-dorsal{position:absolute;right:12px;top:64px;font:800 3.4rem/.9 'Barlow Condensed';color:#fff;text-shadow:0 3px 0 #1748a4,0 5px 18px #000b;-webkit-text-stroke:1px #d8e7ff}
.pc-bottom{position:absolute;left:0;right:0;bottom:0;padding:42px 14px 15px;background:linear-gradient(0deg,#040916f5,#040916bd 70%,transparent)}
.pc-name{font:800 1.65rem/.95 'Barlow Condensed';text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 2px 6px #000}
.pc-role{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:5px;background:#ffd23f;color:#101a35;font:800 .72rem 'Barlow Condensed';letter-spacing:.08em}
.pc-empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#dbeafe;background:linear-gradient(145deg,#101c39,#0b2c69);height:100%;font:700 1.1rem 'Barlow Condensed'}
/* Placeholder premium para jugadores sin avatar */
.pc-placeholder{position:absolute;inset:16% 0 15%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:none;overflow:hidden}
.pc-placeholder:before{content:"";position:absolute;width:68%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#55a6ff55 0%,#2563eb1c 48%,transparent 72%);filter:blur(3px)}
.pc-placeholder .silhouette{position:relative;width:38%;height:58%;max-height:270px;opacity:.8;filter:drop-shadow(0 12px 22px #0007)}
.pc-placeholder .silhouette:before{content:"";position:absolute;left:34%;top:3%;width:32%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#e9f4ff,#7da9e8)}
.pc-placeholder .silhouette:after{content:"";position:absolute;left:12%;right:12%;top:29%;bottom:0;border-radius:45% 45% 16% 16%;background:linear-gradient(110deg,#e8f3ff,#719de0 48%,#244b8c);clip-path:polygon(24% 0,76% 0,100% 24%,83% 42%,73% 31%,78% 100%,22% 100%,27% 31%,17% 42%,0 24%)}
.pc-placeholder span{position:relative;color:#dceaff;font:700 .68rem 'Barlow Condensed';letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.pc-modal{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#020817f2,#071b3bf2);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px)}
.pc-modal.open{display:flex;animation:modalFade .2s ease-out}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.pc-modal-inner{position:relative;height:min(86vh,780px);width:auto;max-width:88vw;aspect-ratio:2/3;overflow:visible;flex:0 1 auto;filter:drop-shadow(0 28px 55px #0009)}
.pc-modal-inner #cromoModalCard{height:100%;width:100%}
.pc-modal-inner .player-card{min-height:0;height:100%;width:100%;aspect-ratio:auto;border-radius:22px;border:1px solid #a8d0ff;box-shadow:inset 0 0 0 1px #ffffff20,0 0 0 6px #ffffff08;cursor:default}
.pc-modal-inner .player-card:hover{transform:none}
.pc-modal-inner .pc-top{padding:clamp(14px,3vh,24px);}
.pc-modal-inner .pc-crest{width:clamp(38px,7vh,56px);height:clamp(38px,7vh,56px);font-size:clamp(9px,1.5vh,12px)}
.pc-modal-inner .pc-season{font-size:clamp(.68rem,1.5vh,.9rem)}
.pc-modal-inner .pc-dorsal{top:clamp(68px,12vh,108px);right:clamp(14px,3vh,24px);font-size:clamp(3.2rem,10vh,6.8rem)}
.pc-modal-inner .pc-bottom{padding:clamp(48px,10vh,92px) clamp(18px,3vh,28px) clamp(18px,3vh,28px)}
.pc-modal-inner .pc-name{font-size:clamp(1.8rem,5vh,3.2rem)}
.pc-modal-inner .pc-role{font-size:clamp(.72rem,1.7vh,.95rem);padding:5px 11px}
.pc-close{position:absolute;right:-15px;top:-15px;z-index:3;display:grid;place-items:center;border-radius:50%;width:44px;height:44px;font-size:1.4rem;background:#fff;color:#10234b;border:2px solid #dbeafe;box-shadow:0 6px 22px #0008;cursor:pointer;transition:transform .18s,background .18s}
.pc-close:hover{transform:rotate(90deg);background:#ffd23f}
.squad-section{margin:24px 0 34px}

async function makeAvatar(i){
 if(!E())return alert('Entra en administración para crear avatares.');
 const name=S.pl[i],role=(S.pos&&S.pos[name])||'campo',fileEl=document.getElementById('avfile'+i),file=fileEl&&fileEl.files&&fileEl.files[0];

 const dorsal=pn(name).num||S.dn[name]||'';
 const btn=document.querySelectorAll('.admin-avatar .on')[i];
 if(btn){btn.disabled=true;btn.textContent='Generando cromo…'}

 try {
  let imgDataUrl = null;
  if(file){
   if(!/^image\/(jpeg|png|webp)$/.test(file.type))return alert('Formato no admitido. Usa JPG, PNG o WebP.');
   imgDataUrl = await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});
  }

  // Crear cromo mediante Canvas localmente
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 1200;
  const ctx = canvas.getContext('2d');

  // 1. Fondo degradado profesional de cromo
  const bgGrad = ctx.createLinearGradient(0, 0, 800, 1200);
  bgGrad.addColorStop(0, '#0b1735');
  bgGrad.addColorStop(0.52, '#1748a4');
  bgGrad.addColorStop(1, '#071126');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 1200);

  if(imgDataUrl) {
   // Si hay foto subida, se procesa
   await new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => {
     ctx.save();
     ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 800, 1200);
     ctx.restore();
     resolve();
    };
    img.onerror = () => resolve();
    img.src = imgDataUrl;
   });
  } else {
   // --- GENERADOR AUTOMÁTICO DE AVATAR FICTICIO CON OPCIONES VARIADAS ---
   // Usamos el nombre del jugador como semilla para que el avatar ficticio sea siempre el mismo para cada jugador, o aleatorio si se prefiere.
   let seed = 0;
   for (let c = 0; c < name.length; c++) seed += name.charCodeAt(c);
   
   const randomChoice = (arr) => arr[seed % arr.length];
   const randomInt = (min, max) => min + (seed % (max - min + 1));

   // Opciones de personalización ficticia
   const tonosPiel = ['#f5d0b1', '#e8b996', '#c68b59', '#8d5524', '#ffdbac'];
   const estilosPelo = ['revuelto', 'media_melena', 'corto', 'rizado', 'rapado'];
   const coloresPelo = ['#2c1608', '#4a3018', '#b55239', '#d4af37', '#111111'];

   const skinColor = randomChoice(tonosPiel);
   const hairStyle = randomChoice(estilosPelo);
   const hairColor = randomChoice(coloresPelo);

   ctx.save();
   // Centrar la ilustración del avatar en la parte superior/central del cromo
   ctx.translate(400, 420);

   // Sombra delbusto
   ctx.fillStyle = 'rgba(0,0,50,0.3)';
   ctx.beginPath();
   ctx.ellipse(0, 160, 140, 70, 0, 0, Math.PI * 2);
   ctx.fill();

   // Cuerpo / Camiseta (Azul Torrejón o Blanco Portero)
   ctx.fillStyle = role === 'portero' ? '#f8fafc' : '#1d4ed8';
   ctx.beginPath();
   ctx.moveTo(-130, 220);
   ctx.lineTo(130, 220);
   ctx.lineTo(110, 110);
   ctx.lineTo(50, 90);
   ctx.lineTo(-50, 90);
   ctx.lineTo(-110, 110);
   ctx.closePath();
   ctx.fill();

   // Cuello de la camiseta
   ctx.strokeStyle = role === 'portero' ? '#94a3b8' : '#93c5fd';
   ctx.lineWidth = 8;
   ctx.beginPath();
   ctx.arc(0, 95, 35, Math.PI, 0, false);
   ctx.stroke();

   // Cabeza y Piel
   ctx.fillStyle = skinColor;
   ctx.beginPath();
   ctx.arc(0, 0, 85, 0, Math.PI * 2);
   ctx.fill();

   // Orejas
   ctx.beginPath();
   ctx.arc(-82, 0, 15, 0, Math.PI * 2);
   ctx.arc(82, 0, 15, 0, Math.PI * 2);
   ctx.fill();

   // Ojos y Cejas
   ctx.fillStyle = '#1e293b';
   ctx.beginPath();
   ctx.arc(-28, -8, 7, 0, Math.PI * 2);
   ctx.arc(28, -8, 7, 0, Math.PI * 2);
   ctx.fill();

   // Cejas deportista concentrado
   ctx.strokeStyle = hairColor;
   ctx.lineWidth = 5;
   ctx.beginPath();
   ctx.moveTo(-42, -22); ctx.lineTo(-14, -16);
   ctx.moveTo(14, -16); ctx.lineTo(42, -22);
   ctx.stroke();

   // Nariz y Sonrisa de concentración
   ctx.strokeStyle = 'rgba(0,0,0,0.2)';
   ctx.lineWidth = 4;
   ctx.beginPath();
   ctx.arc(0, 8, 12, 0.1 * Math.PI, 0.9 * Math.PI, false);
   ctx.stroke();

   // PEINADOS VARIADOS (Pelo revuelto, media melena, rizado, etc.)
   ctx.fillStyle = hairColor;
   if (hairStyle === 'revuelto') {
    // Pelo revuelto con puntas dinámicas
    ctx.beginPath();
    ctx.moveTo(-90, -10);
    ctx.lineTo(-100, -60);
    ctx.lineTo(-60, -95);
    ctx.lineTo(-20, -110);
    ctx.lineTo(20, -115);
    ctx.lineTo(65, -95);
    ctx.lineTo(95, -60);
    ctx.lineTo(90, -10);
    ctx.lineTo(75, -75);
    ctx.lineTo(0, -90);
    ctx.lineTo(-75, -75);
    ctx.closePath();
    ctx.fill();
   } else if (hairStyle === 'media_melena') {
    // Pelo media melena fluido
    ctx.beginPath();
    ctx.arc(0, -20, 92, Math.PI * 0.8, Math.PI * 2.2, false);
    ctx.lineTo(95, 40);
    ctx.lineTo(-95, 40);
    ctx.closePath();
    ctx.fill();
   } else if (hairStyle === 'rizado') {
    // Pelo con textura rizada/volumen
    for(let angle = 0; angle < Math.PI; angle += 0.3) {
     const bx = Math.cos(angle) * 75;
     const by = Math.sin(angle) * -75 - 20;
     ctx.beginPath();
     ctx.arc(bx, by, 22, 0, Math.PI * 2);
     ctx.fill();
    }
   } else if (hairStyle === 'corto') {
    // Estilo militar / corto limpio
    ctx.beginPath();
    ctx.arc(0, -10, 87, Math.PI * 0.82, Math.PI * 2.18, false);
    ctx.closePath();
    ctx.fill();
   } else {
    // Rapado / Degradado moderno
    ctx.beginPath();
    ctx.arc(0, -25, 84, Math.PI * 0.88, Math.PI * 2.12, false);
    ctx.closePath();
    ctx.fill();
   }

   ctx.restore();
  }

  // 2. Superponer marco, iluminación y elementos gráficos del cromo
  const frameGrad = ctx.createRadialGradient(400, 300, 50, 400, 300, 500);
  frameGrad.addColorStop(0, 'rgba(105, 182, 255, 0.4)');
  frameGrad.addColorStop(0.42, 'rgba(37, 99, 235, 0.1)');
  frameGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = frameGrad;
  ctx.fillRect(0, 0, 800, 1200);

  // 3. Cabecera (Temporada)
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 22px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('TEMPORADA 2026/27', 760, 56);

  // 4. Dorsal gigante destacado
  ctx.save();
  ctx.font = '800 160px "Barlow Condensed", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#1748a4';
  ctx.lineWidth = 6;
  ctx.textAlign = 'right';
  ctx.strokeText(dorsal || '—', 760, 210);
  ctx.fillText(dorsal || '—', 760, 210);
  ctx.restore();

  // 5. Caja inferior con el Nombre y Rol
  ctx.fillStyle = 'rgba(4, 9, 22, 0.92)';
  ctx.beginPath();
  ctx.roundRect(40, 940, 720, 210, 20);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#8ab5ff';
  ctx.stroke();

  // Nombre del jugador
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 52px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name.toUpperCase(), 400, 1020);

  // Rol / Categoría
  ctx.fillStyle = '#ffd23f';
  ctx.font = '800 24px "Barlow Condensed", sans-serif';
  ctx.fillText(role === 'portero' ? 'PORTERO · BLANCO' : 'JUGADOR · AZUL', 400, 1070);

  ctx.fillStyle = '#93c5fd';
  ctx.font = '600 18px Barlow, sans-serif';
  ctx.fillText('ESCUELA TORREJÓN JUNCAL B', 400, 1110);

  // Exportar resultado en Base64
  const finalDataUrl = canvas.toDataURL('image/png');

  S.av = S.av || {};
  S.av[name] = { url: finalDataUrl, role, source: file ? 'photo' : 'fictional', updatedAt: Date.now() };
  save();

  alert('¡Avatar ficticio generado con éxito y aplicado al cromo!');
 } catch(e) {
  alert('No se pudo generar el cromo: ' + e.message);
 } finally {
  render();
 }
}

async function unlock(){
  let p = prompt("Contraseña de entrenador");
  if (!p) return;
  p = p.trim();
  let ok = false, er = false;
  try {
    ok = FB ? !!(await fbLogin(p)) : API ? (await(await fetch(API,{method:"POST",body:JSON.stringify({pw:p})})).json()).ok : await sha(p) === PH;
  } catch(e) {
    er = true;
  }
  if (ok) {
    PW = p;
    try { 
      sessionStorage.setItem("adm", "1"); 
      sessionStorage.setItem("pw", p); 
    } catch(e) {}
    
    // Activa la clase edit en el body inmediatamente
    document.body.classList.add("edit");
    
    // Fuerza la recarga completa de la interfaz para mostrar herramientas de admin
    render();
  } else {
    alert(er ? "Error de conexión con Firebase." : "Contraseña incorrecta o usuario no registrado en Firebase Authentication.");
  }
}

async function syncNow(){
 if(!location.hostname.endsWith("github.io"))return alert("Esta función solo funciona desde la web publicada en github.io");
 const u=location.hostname.replace(".github.io",""),sg=location.pathname.split("/")[1]||"",r=sg&&!sg.includes(".")?sg:u+".github.io";
 let tk="";try{tk=localStorage.getItem("ghtk")||""}catch(e){}
 if(!tk){tk=(prompt("Pega tu token de GitHub (solo se guarda en este navegador):")||"").trim();if(!tk)return}
 setSt("Lanzando actualización…");
 try{
  const x=await fetch(`https://api.github.com/repos/${u}/${r}/actions/workflows/sync.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({ref:"main"})});
  if(x.status===204){try{localStorage.setItem("ghtk",tk)}catch(e){}setSt("✓ Actualización lanzada. Los resultados llegarán en 1-2 minutos");setTimeout(()=>setSt(""),20000);return}
  if([401,403,404].includes(x.status)){try{localStorage.removeItem("ghtk")}catch(e){}}
  setSt("⚠ GitHub respondió "+x.status+(x.status==401?" (token no válido)":x.status==404||x.status==403?" (token sin permiso o falta sync.yml en main)":""))
 }catch(e){setSt("⚠ No se pudo contactar con GitHub")}
}
