name: Escudos de los equipos
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"        # los lunes
permissions:
  contents: write
concurrency:
  group: escudos
  cancel-in-progress: false
jobs:
  escudos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Descargar escudos que falten
        env:
          ESCUDO_URL: ${{ vars.ESCUDO_URL }}     # opcional: plantilla con {cod}
        run: node scripts/escudos.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Escudos
          git diff --cached --quiet && echo "Sin escudos nuevos" || (git commit -m "Escudos de equipos" && git pull --rebase -q && git push)
