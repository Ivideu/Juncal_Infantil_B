name: Aplicar parches a las categorías

# Ejecuta los scripts de scripts/ que arreglan o mejoran las páginas de Categorias/ y sube el resultado.
# Se lanza a mano: pestaña Actions > "Aplicar parches a las categorías" > Run workflow.
# Es seguro lanzarlo varias veces: lo que ya está aplicado se salta.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar los scripts
        run: |
          for s in escudos_categorias descanso_categorias cromos_nombres; do
            if [ -f "scripts/$s.py" ]; then echo "=== $s ==="; python3 "scripts/$s.py"; else echo "(no está scripts/$s.py)"; fi
          done
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A Categorias
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Parches de las categorías" && git pull --rebase -q && git push)
