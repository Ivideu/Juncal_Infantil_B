name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apk.yml"
      - "./Images/icon-192.png"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

- name: Crear proyecto Capacitor y configurar app
        run: |
          mkdir -p /tmp/app/www && cd /tmp/app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-firebase/messaging@6 firebase
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "es.juncalb.app",
            "appName": "Juncal B",
            "webDir": "www",
            "server": { 
              "url": "https://torrejonjuncal.es/Categorias/InfantilB.html", 
              "cleartext": true 
            },
            "android": { "allowMixedContent": true }
          }
          JSON
          npx cap add android

      - name: Avisos push (google-services.json de Firebase)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/app/android/app/google-services.json
            echo "google-services.json añadido"
          else
            echo "::warning::Falta el secret GOOGLE_SERVICES_JSON: la app se compila sin avisos push"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Icono de la app
        run: |
          cd /tmp/app/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f "$d/$f" ] && cp "$GITHUB_WORKSPACE/icon-192.png" "$d/$f" || true
            done
          done

      - name: Compilar APK
        run: |
          cd /tmp/app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK en Releases
        run: |
          cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk /tmp/app/android/Juncal-B.apk
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk /tmp/app/android/Juncal-B.apk --title "App Android Juncal B" --notes "Descarga Juncal-B.apk e instálalo en tu móvil Android."
        env:
          GH_TOKEN: ${{ github.token }}