<style>
:root{--bg:#eef4ff;--bg2:#ffffff;--card:rgba(255,255,255,.86);--line:#d5def5;--tx:#0f1b3d;--mu:#5a6a93;--ac:#2f7bff;--ye:#ffd23f;--ye2:#d97706;--ok:#22c55e;--ko:#ef4444;--dr:#f59e0b}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:80px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
h1,h2,.cn{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
.wrap{max-width:980px;margin:auto;padding:0 16px}
/* ===== Fondo animado ===== */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#f4f8ff,#e6efff 55%,#fff7e0)}
#bg i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.6;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
#bg i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:#8bbcff}
#bg i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:8vh;background:#ffe48a;animation-duration:30s;animation-delay:-8s}
#bg i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-24vmax;background:#a6f1c8;animation-duration:27s;animation-delay:-14s}
#bg i:nth-child(4){width:34vmax;height:34vmax;right:12vw;bottom:-10vmax;background:#c7b8ff;animation-duration:34s;animation-delay:-4s;opacity:.45}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.15)}100%{transform:translate(-6vw,12vh) scale(.95)}}
#bg:before{content:"";position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;margin:-39vmin 0 0 -39vmin;border-radius:50%;border:3px solid #2f7bff22;animation:pulse 9s ease-in-out infinite}
#bg:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#2f7bff14}
@keyframes pulse{50%{transform:scale(1.12);border-color:#2f7bff12}}
#bg b{position:absolute;bottom:-70px;font-weight:400;opacity:.2;will-change:transform;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(720deg)}}
/* ===== Cabecera ===== */
header{padding:28px 0 8px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;line-height:1;color:#0f2a6b}
header small{color:var(--mu);display:block;margin-top:6px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:8px 14px;border-radius:10px;transition:.2s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.on{background:var(--ac);border-color:var(--ac);color:#fff}
#hero{--tx:#eef2ff;--mu:#c3d0ff;--bg:#0a0f1e;--bg2:#121a33;--line:#33417a;--ye2:#ffd23f;color:#fff;margin:18px 0;padding:26px;border-radius:22px;background:linear-gradient(135deg,#3d8bff,#1e4fd8 55%,#0f2a78);border:1px solid #7aa9ff;box-shadow:0 14px 40px #1e4fd833;position:relative;overflow:hidden}
#hero>*{position:relative;z-index:1}
#hero:after{pointer-events:none;content:"⚽";position:absolute;right:-20px;bottom:-50px;font-size:200px;opacity:.1;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hv{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:14px 0;text-align:center}
.hv .cn{font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:700;max-width:220px}
.cd{display:flex;gap:10px;justify-content:center}.cd div{background:#0a1f5a66;border-radius:12px;padding:8px 14px;min-width:64px;text-align:center}
.cd b{font:800 2rem 'Barlow Condensed';display:block;line-height:1}.cd span{font-size:.75rem;color:var(--mu)}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px;position:sticky;top:0;z-index:5; justify-content: center;}
nav button{white-space:nowrap;font-weight:600}
nav button span:first-child{margin-right:6px}
@media(max-width:640px){
 nav{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
 nav.x{position:static}
 nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;min-width:0;white-space:normal;text-align:center;line-height:1.15;font-size:clamp(.62rem,3vw,.8rem)}
 nav button span:first-child{margin:0;font-size:1.3rem}
}
@media(max-width:340px){nav{grid-template-columns:repeat(2,1fr)}}
.b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font:800 1rem 'Barlow Condensed';color:#fff;flex:none;border:2px solid #fff;box-shadow:0 2px 8px #0f1b3d33}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 18px #1e4fd814;animation:in .5s both;animation-delay:calc(var(--i)*30ms)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card.me{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 8px 30px #2f7bff29}
.card.rw{background:linear-gradient(#22c55e38,#22c55e22),var(--card);border-color:#22c55e;box-shadow:0 8px 30px #22c55e26}
.card.rd{background:linear-gradient(#fde68a66,#fde68a40),var(--card);border-color:#e9c94f;box-shadow:0 8px 30px #fde68a33}
.card.rl{background:linear-gradient(#f8717140,#f8717126),var(--card);border-color:#f87171;box-shadow:0 8px 30px #f8717126}
.card.rest{opacity:.65}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.dt{background:var(--ye);color:#0a0f1e;font-weight:800;padding:2px 10px;border-radius:6px}
.dtb{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.4rem,5.2vw,2.5rem);padding:6px 22px;border-radius:12px;line-height:1.2;box-shadow:0 6px 24px #ffd23f55}
.top b{color:var(--ye2);font-family:'Barlow Condensed';font-size:1.1rem}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tm{display:flex;align-items:center;gap:10px;font-weight:600;line-height:1.2}
.tm.r{flex-direction:row-reverse;text-align:right}
.sc{font:800 1.8rem 'Barlow Condensed';background:#e3ebff;color:var(--tx);border-radius:10px;padding:2px 14px;min-width:88px;text-align:center}
.sc.t{font-size:1.3rem;color:var(--ac)}
.w{background:#22c55e2e;color:#15803d}.l{background:#ef44442e;color:#b91c1c}.d{background:#f59e0b2e;color:#b45309}
.pill{font:700 .8rem 'Barlow Condensed';padding:1px 10px;border-radius:99px;letter-spacing:.05em}
.meta{margin-top:10px;font-size:.88rem;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:#1d5fe0}
.ed{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap;align-items:center}
body.edit .ed{display:flex}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
body:not(.edit) input{background:#fff}
input.g{width:52px;text-align:center}
table{width:100%;border-collapse:collapse;background:var(--card);backdrop-filter:blur(8px);border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #1e4fd814}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:500;font-size:.8rem;background:#e9f0ff}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{background:#2f7bff26;font-weight:700}
.gap{color:var(--mu)}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ch button{padding:6px 11px;min-width:42px}
.jsel{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;max-width:420px}
.jsel select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;font:700 1rem Barlow,system-ui,sans-serif;color:var(--tx);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%232f7bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 14px center/12px;border:2px solid var(--ac);border-radius:12px;padding:10px 38px 10px 16px;text-align:center;text-align-last:center;cursor:pointer;box-shadow:0 4px 18px #2f7bff29}
.jsel button{flex:none;width:44px;height:44px;padding:0;font-size:1.5rem;line-height:1;font-weight:700;border-radius:12px}
.jsel button:disabled{opacity:.35;cursor:default;transform:none}
.jsel select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ye));transition:width 1s}
.gl{display:grid;grid-template-columns:30px 1fr 40px;gap:12px;align-items:center;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#adm{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--ac);padding:10px;justify-content:center;gap:8px;flex-wrap:wrap;z-index:9;box-shadow:0 -6px 24px #1e4fd822}
body.edit #adm{display:flex}
select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px}.gc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%}.gc button{padding:3px 10px;font-size:.85rem}
.live{text-align:center}.lt{font:700 1.15rem 'Barlow Condensed';letter-spacing:.06em;color:var(--ye)}
.lb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0}.lb .cn{font-size:clamp(1rem,3.6vw,1.7rem);font-weight:700}
.big{font:800 clamp(3.2rem,15vw,6.5rem)/1 'Barlow Condensed';background:#0a1f5a73;border-radius:18px;padding:4px 22px;white-space:nowrap}
.lclk{font:800 clamp(3.6rem,16vw,7rem)/1 'Barlow Condensed';background:var(--ye);color:#0a0f1e;display:inline-block;border-radius:12px;padding:4px 22px;box-shadow:0 6px 24px #ffd23f44}
.pb{display:flex;gap:8px;max-width:420px;margin:14px auto 0}.pb div{flex:1;height:8px;background:#0a1f5a66;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ye);width:0;transition:width 1s linear}
.lg{margin-top:14px}.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.g2 button{font-size:1.05rem;font-weight:700;padding:12px 16px;flex:1;min-width:140px}.g2 button:first-child{background:var(--ac);border-color:var(--ac)}
.gl2{display:inline-flex;align-items:center;gap:8px}.gl2 .mi{font:800 1.2rem 'Barlow Condensed';color:var(--ye2);min-width:36px;text-align:right}.gl2 .gn{color:var(--tx);font-weight:600;font-size:1.05rem}
.gls{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:4px}.lg>div{margin-top:6px}
.loc{text-align:center;margin:0 0 16px}.loc a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}.loc a:hover{color:var(--ye)}
.fsb{font-weight:600}
#hero.fs{--k:1;position:fixed;inset:0;z-index:100;margin:0;border:0;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 18px 6px;background:radial-gradient(900px 500px at 50% 0,#1d3a8a,#050b1f);overflow:hidden;display:flex}
#hero.fs.adm{--k:.9}
#hero.fs.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#hero.fs .live{height:100%;width:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
#hero.fs .lt{font-size:calc(var(--u)*6*var(--k))}
#hero.fs .lb{display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*2);width:100%;max-width:none;margin:calc(var(--u)*1.5*var(--k)) 0}
#hero.fs .big{flex:none}
#hero.fs .big.s{font-size:calc(var(--u)*24*var(--k))}
#hero.fs .ts{flex-direction:column;gap:calc(var(--u)*1*var(--k));width:calc(var(--u)*30*var(--k))}
#hero.fs .ti{max-width:100%}
#hero.fs .gb{width:auto}
#hero.fs .gbtn{width:calc(var(--u)*20*var(--k));font-size:calc(var(--u)*3.4*var(--k));padding:calc(var(--u)*.5)}
#hero.fs .gmn{font-size:calc(var(--u)*3*var(--k));padding:calc(var(--u)*.4) calc(var(--u)*1.6)}
#hero.fs .pbl{display:none}
#hero.fs .lb .cn{font-size:calc(var(--u)*5.5*var(--k))}
#hero.fs .b{width:calc(var(--u)*13*var(--k));height:calc(var(--u)*13*var(--k));font-size:calc(var(--u)*5*var(--k))}
#hero.fs .big{font-size:calc(var(--u)*32*var(--k));padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*4)}
#hero.fs .lclk{font-size:calc(var(--u)*20*var(--k));padding:calc(var(--u)*.5) calc(var(--u)*6)}
#hero.fs .pb{width:70%;max-width:none;margin-top:calc(var(--u)*2*var(--k))}
#hero.fs .lg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--gr,2),auto);justify-content:center;column-gap:calc(var(--u)*4);row-gap:calc(var(--u)*.8);width:100%;margin-top:calc(var(--u)*2*var(--k));font-size:calc(var(--u)*5*var(--gs,1)*var(--k))}
#hero.fs .lg>b,#hero.fs .loc{display:none}
#hero.fs .lg>div{margin:0}
#hero.fs .gl2{gap:calc(var(--u)*1.6*var(--gs,1))}
#hero.fs .gl2 svg{width:calc(var(--u)*7*var(--gs,1)*var(--k));height:auto}
#hero.fs .gl2 .mi{font-size:calc(var(--u)*6*var(--gs,1)*var(--k));min-width:0}
#hero.fs .gl2 .gn{font-size:calc(var(--u)*5*var(--gs,1)*var(--k))}
#hero.fs .admw{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.2);width:100%;margin-top:auto;padding-top:calc(var(--u)*1.5)}
#hero.fs .admw .ctl{display:contents}
#hero.fs .admw button,#hero.fs .admw select{font-size:calc(var(--u)*4.4);padding:calc(var(--u)*1.3) calc(var(--u)*2.8);min-width:0;flex:none;width:auto!important;max-width:none!important}
#hero.fs .xb{position:absolute;top:0;right:0;z-index:2}
.dot{animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
@media(max-width:560px){.mt{grid-template-columns:1fr auto 1fr}.tm{flex-direction:column;text-align:center!important;gap:4px;font-size:.85rem}.sc{min-width:70px;font-size:1.5rem}.b{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Celebración de gol ===== */
#golOv{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;padding:10px;text-align:center;cursor:pointer;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 42%,#3d8bff,#1e4fd8 40%,#0f2a78 72%,#050b1f);animation:goBg .3s both}
#golOv.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#golOv.out{animation:goOut .35s both}
@keyframes goBg{from{opacity:0}}
@keyframes goOut{to{opacity:0}}
#golOv .go-t{font:800 clamp(3.4rem,19vmin,11rem)/1 'Barlow Condensed',sans-serif;letter-spacing:.05em;color:var(--ye);text-shadow:0 0 34px #ffd23fcc,0 5px 0 #b45309;animation:goPop .85s cubic-bezier(.2,1.7,.4,1) both,goPulse 1s .85s ease-in-out infinite;position:relative;z-index:2}
@keyframes goPop{from{transform:scale(0) rotate(-14deg);opacity:0}}
@keyframes goPulse{50%{transform:scale(1.09) rotate(-2deg)}}
#golOv .go-c{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;animation:goCard .9s .1s cubic-bezier(.2,1.5,.4,1) both}
#golOv .go-c:before{content:"";position:absolute;inset:-9%;border-radius:50%;background:radial-gradient(circle,#ffd23fcc,transparent 66%);animation:goGlow 1.2s ease-in-out infinite}
#golOv .go-c img{position:relative;display:block;max-height:52vh;max-width:78vw;width:auto;height:auto;border-radius:18px;box-shadow:0 14px 50px #000a;animation:goWig 1.6s 1s ease-in-out infinite}
#golOv .go-c svg{position:relative;width:34vmin;height:auto;filter:drop-shadow(0 10px 24px #000a)}
@keyframes goCard{from{transform:scale(0) rotate(-28deg);opacity:0}60%{transform:scale(1.14) rotate(6deg)}}
@keyframes goGlow{50%{transform:scale(1.14);opacity:.65}}
@keyframes goWig{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1.4vmin)}}
#golOv .go-n{font:800 clamp(1.5rem,7vmin,3.4rem)/1.1 'Barlow Condensed',sans-serif;letter-spacing:.04em;position:relative;z-index:2;animation:goUp .6s .5s both}
#golOv .go-s{font:600 clamp(.9rem,3.6vmin,1.5rem)/1.2 Barlow,sans-serif;color:#dbe7ff;position:relative;z-index:2;animation:goUp .6s .7s both}
@keyframes goUp{from{transform:translateY(16px);opacity:0}}
#golOv .go-k{position:absolute;top:-8vh;pointer-events:none;z-index:1;will-change:transform;animation:goFall linear infinite}
@keyframes goFall{to{transform:translateY(118vh) rotate(720deg)}}
/* miniatura en goleadores */
.gl{grid-template-columns:30px 44px 1fr 40px}
.gmini{width:44px;height:auto;max-height:62px;object-fit:contain;border-radius:6px;box-shadow:0 2px 8px #0f1b3d40;cursor:pointer;display:block}
.gmini.no{display:grid;place-items:center;width:44px;height:44px;box-shadow:none}
/* ===== Directo: botones de gol y selector de goleador ===== */
.ts{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.ti{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gb{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.gbtn{width:min(100%,170px);aspect-ratio:4/3;font:700 clamp(.85rem,3.2vw,1.2rem)/1.15 Barlow,system-ui,sans-serif;padding:6px;border-radius:14px;white-space:normal;word-break:break-word;display:flex;align-items:center;justify-content:center;text-align:center}
.gbtn.me{background:var(--ac);border-color:var(--ac);color:#fff}
.gmn{padding:2px 12px;font-size:.8rem;border-radius:8px}
#pickOv{position:fixed;inset:0;z-index:9997;display:flex;flex-direction:column;align-items:center;gap:1.4vmin;padding:2vmin;color:#fff;background:rgba(2,8,23,.95);overflow:hidden}
#pickOv.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#pickOv .pk-h{font:800 clamp(1.4rem,6vmin,3rem)/1 'Barlow Condensed',sans-serif;letter-spacing:.05em;color:var(--ye)}
#pickOv .pk-g{flex:1;min-height:0;width:100%;overflow:hidden;display:grid;justify-content:center;align-content:center}
#pickOv .pk-c{padding:0;border:0;background:none;cursor:pointer;border-radius:14px;width:100%;display:block}
#pickOv .pk-c img{display:block;width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 8px 24px #0009}
#pickOv .pk-o{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;background:#122a66;border:2px solid #7aa9ff;color:#fff;font-size:clamp(.75rem,2.4vmin,1.1rem);padding:6px}
#pickOv .pk-o span{font-size:7vmin;line-height:1}
#pickOv .pk-x{flex:none;font-weight:700;padding:1.2vmin 4vmin}
/* ===== Escudos y partido de prueba ===== */
.b{position:relative}
.b img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:drop-shadow(0 2px 4px #0f1b3d55)}
.b.ok{background:transparent!important;border-color:transparent;box-shadow:none;color:transparent}
.b.ok img{opacity:1}
.tbanner{background:#f59e0b;color:#0a0f1e;font:800 .95rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;padding:4px 12px;border-radius:8px;display:inline-block;margin-bottom:8px}

/* ===== FIX pantalla completa: cámara/notch y desbordamiento ===== */
#hero.fs{
  height:100vh;height:100dvh;
  padding:
    calc(env(safe-area-inset-top,0px) + 6px)
    calc(env(safe-area-inset-right,0px) + 14px)
    calc(env(safe-area-inset-bottom,0px) + 6px)
    calc(env(safe-area-inset-left,0px) + 14px);
}
/* Rotado (móvil en vertical): los lados de la zona segura cambian de sitio */
#hero.fs.rot{
  height:100vw;
  padding:
    calc(env(safe-area-inset-right,0px) + 6px)
    calc(env(safe-area-inset-bottom,0px) + 14px)
    calc(env(safe-area-inset-left,0px) + 6px)
    calc(env(safe-area-inset-top,0px) + 14px);
}
/* El desbordamiento solo va hacia abajo (así se puede medir y reducir) */
#hero.fs .live{justify-content:flex-start}
#hero.fs .live>:first-child{margin-top:auto}
#hero.fs .live>:last-child{margin-bottom:auto}
/* Los botones de admin también escalan con --k */
#hero.fs .admw button,#hero.fs .admw select{
  font-size:calc(var(--u)*4.4*var(--k));
  padding:calc(var(--u)*1.3*var(--k)) calc(var(--u)*2.8*var(--k));
}

/* ===== Escudos más grandes y pegados a los laterales (pantalla completa) ===== */
#hero.fs .lb{justify-content:space-between;padding:0 calc(var(--u)*2)}
#hero.fs .ts{width:calc(var(--u)*36*var(--k))}
#hero.fs .b{
  width:calc(var(--u)*20*var(--k));
  height:calc(var(--u)*20*var(--k));
  font-size:calc(var(--u)*7*var(--k));
}

/* ===== Aviso de GOL: más ajustado, con margen arriba/abajo y zona segura ===== */
#golOv{
  height:100vh;height:100dvh;
  gap:1.5vmin;
  padding:
    calc(env(safe-area-inset-top,0px) + 5vmin)
    calc(env(safe-area-inset-right,0px) + 4vmin)
    calc(env(safe-area-inset-bottom,0px) + 5vmin)
    calc(env(safe-area-inset-left,0px) + 4vmin);
}
#golOv.rot{
  height:100vw;
  padding:
    calc(env(safe-area-inset-right,0px) + 5vmin)
    calc(env(safe-area-inset-bottom,0px) + 4vmin)
    calc(env(safe-area-inset-left,0px) + 5vmin)
    calc(env(safe-area-inset-top,0px) + 4vmin);
}
/* vmin sirve en horizontal y también con la pantalla girada */
#golOv .go-t{font-size:clamp(2.6rem,15vmin,9rem)}
#golOv .go-c img{max-height:40vmin;max-width:70vmax}
#golOv .go-c svg{width:28vmin}
#golOv .go-n{font-size:clamp(1.3rem,6vmin,3rem)}
#golOv .go-s{font-size:clamp(.85rem,3.2vmin,1.4rem)}

/* ===== Selector de goleador: zona segura ===== */
#pickOv{
  height:100vh;height:100dvh;
  padding:
    calc(env(safe-area-inset-top,0px) + 2vmin)
    calc(env(safe-area-inset-right,0px) + 2vmin)
    calc(env(safe-area-inset-bottom,0px) + 2vmin)
    calc(env(safe-area-inset-left,0px) + 2vmin);
}
#pickOv.rot{
  height:100vw;
  padding:
    calc(env(safe-area-inset-right,0px) + 2vmin)
    calc(env(safe-area-inset-bottom,0px) + 2vmin)
    calc(env(safe-area-inset-left,0px) + 2vmin)
    calc(env(safe-area-inset-top,0px) + 2vmin);
}

/* ===== Convocatoria: cuadrícula con botones SÍ / NO ===== */
.cvsum{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cvs{font:800 1.05rem 'Barlow Condensed',sans-serif;letter-spacing:.04em;padding:3px 12px;border-radius:99px;background:#22c55e2e;color:#15803d}
.cvs.x{background:#ef44442e;color:#b91c1c}
.cvg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(min-width:600px){.cvg{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}}
.cvc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px #1e4fd814;min-width:0}
.cvc.si{border-color:#22c55e;background:linear-gradient(#22c55e30,#22c55e14),var(--card)}
.cvc.no{border-color:#ef4444;background:linear-gradient(#ef444430,#ef444414),var(--card)}
.cvc img{display:block;width:100%;max-width:130px;height:auto;border-radius:10px;transition:opacity .2s,filter .2s}
.cvc.no img{opacity:.55;filter:grayscale(.7)}
.cvname{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25;min-width:0}
.cvname span{font-size:.85rem}
.cvb{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.cvb button{min-height:48px;padding:0;border-radius:12px;border:2px solid;background:#fff;font:800 1.25rem 'Barlow Condensed',sans-serif;letter-spacing:.08em;opacity:.55;-webkit-tap-highlight-color:transparent}
.cvb .s{border-color:#22c55e;color:#15803d}
.cvb .n{border-color:#ef4444;color:#b91c1c}
.cvc.si .cvb .s{background:#22c55e;color:#fff;opacity:1;box-shadow:0 4px 14px #22c55e66}
.cvc.no .cvb .n{background:#ef4444;color:#fff;opacity:1;box-shadow:0 4px 14px #ef444466}
.cvb button:active{transform:scale(.96)}

/* ===== Pestaña Jugadores: cabeceras, etiqueta y modo solo lectura ===== */
.cvhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.cvhd h2{font-size:1.7rem;font-weight:800;color:#0f2a6b;line-height:1;margin-right:4px}
.cvc img{cursor:pointer}
.cvl{font:700 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:var(--mu);margin-top:-2px}
.cvb.ro span{display:grid;place-items:center;min-height:44px;border-radius:12px;border-width:2px;border-style:solid;background:#fff;font:800 1.2rem 'Barlow Condensed',sans-serif;letter-spacing:.08em;opacity:.45;user-select:none;-webkit-user-select:none}

/* Todos los cromos con el mismo tamaño */
.cvc img{width:100%;max-width:130px;height:auto;aspect-ratio:11/20;object-fit:contain}

/* Vista pública: un único botón de estado a todo el ancho */
.cvst{width:100%;min-height:46px;display:grid;place-items:center;padding:0 6px;border-radius:12px;color:#fff;white-space:nowrap;font:800 clamp(.95rem,4vw,1.15rem) 'Barlow Condensed',sans-serif;letter-spacing:.06em;user-select:none;-webkit-user-select:none}
.cvst.s{background:#22c55e;box-shadow:0 4px 14px #22c55e66}
.cvst.n{background:#ef4444;box-shadow:0 4px 14px #ef444466}

.cvsub{margin-top:6px;font:600 1.05rem/1.45 Barlow,system-ui,sans-serif;color:var(--tx)}

/* Plantilla: botón activo/inactivo y jugadores sin cromo */
.plt{font-weight:700;background:#e5e9f5;color:#5a6a93}
.plt.act{background:#22c55e;border-color:#22c55e;color:#fff}
.cvph{width:100%;max-width:130px;aspect-ratio:11/20;display:grid;place-items:center;border-radius:10px;background:linear-gradient(160deg,#1d3a8a,#0a1a4d);border:2px solid #7aa9ff;transition:opacity .2s,filter .2s}
.cvph svg{width:72%;height:auto}
.cvc.no .cvph{opacity:.55;filter:grayscale(.7)}
#pickOv .pk-o svg{width:46%;height:auto}
.dl{display:inline-flex;align-items:center;gap:6px;background:#2f7bff;color:#fff;font-weight:700;text-decoration:none;padding:10px 16px;border-radius:12px;box-shadow:0 4px 14px #2f7bff40}
.dl:hover{background:#1d5fe0}
@media(display-mode:standalone){.dl{display:none}}

/* ===== Cabecera panorámica Torrejón Juncal ===== */
header.site-banner {
  position: relative;
  width: 100%;
  max-width: 100%;
  margin: 0 auto 18px;
  aspect-ratio: 1347 / 375;
  height: auto;
  min-height: 0;
  padding: 0;
  display: block;
  overflow: hidden;
  border-radius: 16px;
  background-color: #050b1f;
  background-image: linear-gradient(180deg, transparent 65%, rgba(5, 11, 31, .45) 100%), url('../../Images/cabecera-juncal.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-bottom: 2px solid #2f7bff;
  box-shadow: 0 8px 28px rgba(0, 40, 120, .35);
}
header.site-banner > div { position: static; }
header.site-banner #tt {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  font-size: 0;
  line-height: 0;
  color: transparent;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
header.site-banner small { display: none; }
header.site-banner .dl {
  position: absolute;
  z-index: 2;
  top: 12px;
  right: 16px;
}
@media (max-width: 600px) {
  header.site-banner {
    width: 100%;
    aspect-ratio: 1347 / 375;
    min-height: 0;
    background-position: center;
    border-radius: 12px;
  }
  header.site-banner .dl {
    top: 6px;
    right: 8px;
    font-size: 12px;
    padding: 6px 9px;
  }
}
@media (prefers-reduced-motion: reduce) {
  header.site-banner { scroll-behavior: auto; }
}

/* ===== Cartel FIN PARTIDO (sustituye al cronómetro cuando el partido termina) ===== */
.lfin{letter-spacing:.06em;background:var(--ye);color:#0a0f1e;display:inline-block;border-radius:12px;padding:6px 26px;box-shadow:0 6px 24px #ffd23f44}
#hero.fs .lfin{font-size:calc(var(--u)*13*var(--k));padding:calc(var(--u)*.5) calc(var(--u)*5)}

/* ===== Copa: cuadro por rondas ===== */
.bkt{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.bkc{flex:0 0 min(300px,88%)}
.bkc>h3{font:800 1.3rem 'Barlow Condensed',sans-serif;color:var(--ye2);text-align:center;margin-bottom:8px}
/* ===== Caja azul final con botón Volver ===== */
.volver{margin:36px 0 10px;padding:24px 18px;border-radius:22px;text-align:center;color:#fff;background:linear-gradient(135deg,#3d8bff,#1e4fd8 55%,#0f2a78);border:1px solid #7aa9ff;box-shadow:0 14px 40px #1e4fd833}
.volver p{margin-bottom:14px;font-weight:600}
.volver button{background:var(--ye);color:#0a0f1e;border:0;font-weight:800;font-size:1.05rem;padding:12px 30px;border-radius:12px;box-shadow:0 4px 14px rgba(8,18,53,.35)}
.volver button:hover{transform:translateY(-2px)}

/* ===== Entrenos (solo admin, sin cromos) ===== */
.entb{display:flex;gap:8px}
.entb button{width:56px;height:46px;padding:0;border-radius:12px;font:800 1.5rem/1 Barlow,system-ui,sans-serif;border:2px solid;background:#fff;display:grid;place-items:center}
.entb .s{border-color:#22c55e;color:#15803d}.entb .s.act{background:#22c55e;color:#fff;box-shadow:0 4px 14px #22c55e66}
.entb .n{border-color:#ef4444;color:#b91c1c}.entb .n.act{background:#ef4444;color:#fff;box-shadow:0 4px 14px #ef444466}
.entp{font:800 1.15rem 'Barlow Condensed',sans-serif;color:var(--mu);min-width:92px;text-align:right}
.entp.ok{color:#15803d}.entp.ko{color:#b91c1c}
.entw td,.entw th{padding:10px 6px}
.entw .v{color:#15803d;font:800 1.3rem 'Barlow Condensed',sans-serif}
.entw .x{color:#b91c1c;font:800 1.3rem 'Barlow Condensed',sans-serif}
.entw .z{color:var(--mu)}
.entw th small{display:block;font-weight:500;font-size:.72rem}

/* ===== Login, Jugadas (vídeos) y Pizarra del entrenador ===== */
.mdl{position:fixed;inset:0;background:rgba(3,8,28,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10000}
.mdl[hidden]{display:none}
.mdl .card{width:min(560px,100%);max-height:94vh;overflow:auto;background:#fff;animation:none}
.mdl label,#pizW label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:12px 0 4px}

#lgErr{background:#fee2e2;border:1px solid #ef4444;color:#7f1d1d;border-radius:10px;padding:8px 12px;margin-top:12px}

#pst{margin-top:8px;font-size:.9rem;min-height:18px}

.pj video,.pjv,.pjn{width:100%;aspect-ratio:43.2/23.2;border-radius:10px;display:block}

.pjv{border:0;color:#fff;font-size:3rem;cursor:pointer;background:linear-gradient(160deg,#1d3a8a,#0a1a4d)}

#toast.show{opacity:1}
</style>
