name: Sync resultados RFFM
on:
  workflow_dispatch:           # ejecución manual = revisión completa de las 22 jornadas
  schedule:
    - cron: "*/10 7-21 * * 0,6"   # sábado y domingo: cada 10 min
    - cron: "*/10 7-21 * * 1,2"   # lunes y martes: cada 10 min
    - cron: "0 7-21 * * 3-5"      # miércoles, jueves y viernes: cada hora
    # Las cron van en UTC y cubren invierno y verano; el script solo actúa de 9:00 a 22:00 hora de Madrid
concurrency:
  group: sync-rffm
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SOLO_CERRADAS: "1"     # "1" = solo guarda resultados con el acta cerrada; "0" = en cuanto aparezcan