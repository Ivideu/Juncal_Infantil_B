<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="light">
<title>Torrejón Juncal · App</title>
<link rel="icon" href="Images/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef4ff;--card:#fff;--line:#d5def5;--tx:#0f1b3d;--mu:#5a6a93;--nv:#0a1f55;--ye:#ffd23f;--ac:#2f7bff;--ok:#16a34a;--ko:#dc2626;--dr:#d97706}
*{box-sizing:border-box;margin:0}
html{background:#0f2a78}
body{font:16px/1.45 Barlow,system-ui,sans-serif;color:var(--tx);background:transparent;min-height:100vh;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(rgba(8,18,53,.22),rgba(8,18,53,.22)),linear-gradient(90deg,#f2b705 0%,#ffd23f 18%,#ffe98f 30%,#dbe8ff 42%,#5b9bff 58%,#1e4fd8 78%,#0f2a78 100%),#0f2a78}
h1,h2,.cn{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
header{background:linear-gradient(135deg,#0a1f55,#17399a);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0004}
.top{max-width:720px;margin:auto;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:12px}
.top h1{font-size:1.5rem;line-height:1;flex:1}
.top small{display:block;font:500 .8rem Barlow,sans-serif;opacity:.8;letter-spacing:0}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:8px 14px;background:var(--ye);color:#1b2440;font-weight:700}
button.gh{background:#ffffff22;color:#fff}
main{max-width:720px;margin:auto;padding:14px 16px}
.note{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.92rem;color:var(--mu)}
.note b{color:var(--tx)}
.card{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(8,18,53,.25)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ch h2{font-size:1.35rem;flex:1;line-height:1.1}
.ch h2 small{display:block;font:500 .78rem Barlow,sans-serif;color:var(--mu);letter-spacing:0}
.bell{width:42px;height:42px;padding:0;font-size:1.2rem;background:var(--bg);color:var(--mu);border:1px solid var(--line)}
.bell.on{background:var(--ye);color:#1b2440;border-color:var(--ye)}
.vs{display:flex;align-items:center;justify-content:space-around;gap:8px;text-align:center}
.vs>div{flex:1;min-width:0}
.vs .cn{font-size:1rem;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.vs .mid{flex:none;font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:800;white-space:nowrap}
.sh{width:54px;height:54px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px}
.when{text-align:center;margin-top:10px;font-weight:600}
.when span{display:inline-block;background:var(--nv);color:#fff;border-radius:999px;padding:3px 12px;font-size:.92rem}
.loc{text-align:center;color:var(--mu);font-size:.88rem;margin-top:4px}
.loc a{color:var(--ac);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor}
.last{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:center;font-size:.92rem}
.last .r{flex:1;min-width:0}
.pill{flex:none;border-radius:999px;padding:1px 9px;font-weight:700;font-size:.8rem;color:#fff}
.pill.w{background:var(--ok)}.pill.l{background:var(--ko)}.pill.d{background:var(--dr)}
.row{display:flex;gap:8px;margin-top:12px}
.row a{flex:1;text-align:center;text-decoration:none;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:8px;font-weight:600}
.row a.p{background:var(--nv);color:#fff;border-color:var(--nv)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:0 4px 18px rgba(8,18,53,.25)}
.tabs button{flex:1;background:transparent;color:var(--mu);padding:9px 8px;font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;letter-spacing:.03em}
.tabs button.on{background:var(--nv);color:#fff}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--ye);color:#1b2440;font:800 .75rem Barlow,sans-serif}
.card.loc2{border-left:6px solid var(--ye)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-weight:700;font-size:.74rem;background:var(--ye);color:#1b2440;margin-left:6px;vertical-align:middle}
.pend{text-align:center;margin-top:10px;background:#fff7d6;border:1px dashed #e0b400;border-radius:12px;padding:8px 10px;font-weight:600;color:#6b5600}
.pend small{display:block;font-weight:500;opacity:.85}
.rest2{text-align:center;padding:12px 0;font-weight:700}
.rest2 span{display:block;font-size:2.2rem}
.sgen{width:54px;height:54px;display:block;margin:auto}
.grp{font:800 .8rem Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:12px 0 2px}
.empty{color:var(--mu);text-align:center;padding:8px 0}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{font-size:1.5rem;margin-bottom:4px}
.sheet p{color:var(--mu);font-size:.9rem;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:600}
.opt input{width:22px;height:22px;accent-color:#2f7bff}
.btns{display:flex;gap:8px;margin:10px 0}
.btns button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--line)}
#msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:688px;margin:auto;background:#111c3a;color:#fff;border-radius:14px;padding:12px 14px;display:none;z-index:30;font-size:.92rem}
#msg.on{display:block}
.ft{text-align:center;margin-top:8px;text-shadow:0 1px 4px rgba(8,18,53,.75),0 0 14px rgba(8,18,53,.45)}
.ft a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.web{display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
  margin-bottom:14px;padding:14px 16px;border-radius:20px;text-decoration:none;
  color:#0a1f55;background:linear-gradient(135deg,#ffe27a,#ffd23f 45%,#ffb800);
  border:2px solid #fff;box-shadow:0 8px 24px rgba(8,18,53,.45),inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .15s}
.web:active{transform:scale(.97)}
.web img{width:50px;height:50px;border-radius:50%;background:#fff;padding:3px;flex:none;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.web .t{flex:1;min-width:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:1.55rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.web .t small{display:block;margin-top:4px;font:600 .82rem Barlow,sans-serif;
  text-transform:none;letter-spacing:0;opacity:.75}
.web .go{flex:none;width:42px;height:42px;border-radius:50%;background:#0a1f55;color:#fff;
  display:grid;place-items:center;font-size:1.4rem;font-weight:700;animation:nudge 1.4s ease-in-out infinite}
.web::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes nudge{50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.web::after,.web .go{animation:none}}
</style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
<header><div class="top">
  <img src="Images/icon-192.png" alt="">
  <h1>Torrejón Juncal<small id="upd">Cargando…</small></h1>
  <button class="gh" id="bAv">🔔 Avisos</button>
</div></header>
<main>
  <div id="inf" class="note" hidden></div>

  <nav class="tabs" id="tabs" aria-label="Competición"><button data-t="fed" class="on">🏆 Federados</button><button data-t="loc">⚽ Local</button></nav>
  <div id="lista"></div>
</main>

<div class="sheet" id="sh"><div>
  <h2>🔔 Avisos de equipos</h2>
  <p>Recibirás una notificación cuando haya día, hora y pabellón del partido, cuando cambie, y al publicarse el resultado. Elige uno, varios o todos.</p>
  <div class="btns"><button id="bTodos">Todos</button><button id="bNing">Ninguno</button></div>
  <div id="ops"></div>
  <div class="btns"><button id="bCerrar" style="background:var(--ye);color:#1b2440;border:0">Listo</button></div>
</div></div>
<div id="msg" role="status"></div>
  <a class="web" href="index.html">
  <img src="Images/escudo.png" alt="">
  <span class="t">Visita la web del club<small>Noticias, fotos, horarios y más</small></span>
  <span class="go" aria-hidden="true">➜</span>
</a>
<script>
const FB="https://juncal-f0b64-default-rtdb.europe-west1.firebasedatabase.app";
const CATS=[
 ["aficionado-a","Aficionado A","AficionadoA"],["aficionado-b","Aficionado B","AficionadoB"],
 ["juvenil-a","Juvenil A","JuvenilA"],["juvenil-b","Juvenil B","JuvenilB"],
 ["cadete-a","Cadete A","CadeteA"],["cadete-b","Cadete B","CadeteB"],
 ["infantil-a","Infantil A","InfantilA"],["infantil-b","Infantil B","InfantilB"],
 ["alevin-a","Alevín A","AlevinA"],["alevin-b","Alevín B","AlevinB"]];
// Competición local (Ayuntamiento de Torrejón): una ficha por equipo del Juncal. Tema de avisos: juncal-local-<cat>
const LCATS=[["cadete","Cadete"],["infantil","Infantil"],["alevin","Alevín"],["benjamin","Benjamín"],["prebenjamin","Prebenjamín"]];
let LOCAL=[];   // un elemento por equipo del Juncal: [id, categoría, cat, equipo]; id = local-<cat>-<equipo> (tema de avisos juncal-<id>)
const ESJ=n=>/jun?cal/i.test(n||"");
const nrm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
let LD={},LR={},tab="fed";try{tab=localStorage.getItem("jb_tab")||"fed"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const FM=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.FirebaseMessaging;
if(FM())LS.set("jb_app","1");          // dentro de la app, las páginas de categoría no se suscriben solas a ningún tema
let av=[];try{av=JSON.parse(LS.get("jb_av")||"[]")}catch(e){}
let px=[];
function toast(t){const m=$("#msg");m.textContent=t;m.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove("on"),4500)}
const fecha=(f,h)=>{const d=new Date(f+"T12:00:00Z").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).replace(".","");return d[0].toUpperCase()+d.slice(1)+(h?" · "+h+" h":"")};
const NEUTRO="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M24 4l16 6v12c0 11-7 18-16 22C15 40 8 33 8 22V10z" fill="#c6d0ea"/><path d="M24 4l16 6v12c0 11-7 18-16 22z" fill="#a9b7dd"/></svg>');
const escudo=(cod,own)=>`<img class="sh" alt="" src="${own?"Images/escudo.png":"Escudos/"+encodeURIComponent(cod)+".png"}" onerror="this.onerror=null;this.src=NEUTRO">`;
// Enlace a Google Maps con la ruta hasta el campo ("Cómo llegar" desde la ubicación actual)
const mapa=c=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(c);


// Escudo genérico (equipos locales sin escudo): color propio + iniciales
const COL=[["#e11d48","#7f1d3a"],["#16a34a","#14532d"],["#7c3aed","#3b1d7a"],["#ea580c","#7c2d12"],["#0891b2","#134e5e"],["#be185d","#5b1030"],["#65a30d","#365314"],["#0f766e","#0b3b38"],["#b45309","#5a2d0c"],["#475569","#1e293b"]];
function sgen(n){
  n=String(n||"");let h=0;for(const ch of n.toUpperCase().replace(/[^A-Z0-9"]/g,""))h=(h*31+ch.charCodeAt(0))>>>0;
  const [c1,c2]=COL[h%COL.length],suf=(n.match(/"?\b([AB])"?\s*$/)||[])[1]||"",id="g"+h;
  const ini=n.replace(/\./g," ").split(/\s+/).filter(w=>/^[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(w)&&w.length>1).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
  return `<svg class="sgen" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><path d="M50 9 L83 20 V48 C83 69 68 82 50 91 C32 82 17 69 17 48 V20 Z" fill="url(#${id})" stroke="#ffd23f" stroke-width="4" stroke-linejoin="round"/><text x="50" y="${suf?56:62}" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="800" font-style="italic" font-size="38" fill="#fff">${esc(ini)}</text>${suf?`<text x="50" y="76" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="20" fill="#ffd23f">${suf}</text>`:""}</svg>`;
}
const escL=(n)=>ESJ(n)?`<img class="sh" alt="" src="Images/escudo.png">`:sgen(n);
const campoTxt=c=>{const m=String(c||"").match(/nuria[^\d]*(\d)/i);return /nuria/i.test(c||"")?"Nuria Fernández"+(m?" · Pab. "+m[1]:""):String(c||"")};
const campoUrl=c=>/nuria/i.test(c||"")?mapa("TORREJON DE ARDOZ - P.M. NURIA FERNANDEZ"):mapa(c);
const hoyISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Madrid"});
// Resultado manual de entrenadores (solo si el Ayuntamiento no lo ha publicado)
function jornadasL(cat){
  const d=LD[cat];if(!d)return null;const m=LR[cat]||{};
  return (d.jornadas||[]).map(j=>({...j,partidos:(j.partidos||[]).map(p=>{
    if(p.ga==null&&p.gb==null){const r=m[j.n+"_"+nrm(p.local)+"_"+nrm(p.visitante)];if(r&&Number.isInteger(r.ga)&&Number.isInteger(r.gb))return {...p,ga:r.ga,gb:r.gb,man:1}}
    return p})}));
}
function cardL(c){
  const [id,nombre,cat,eq]=c,on=av.includes(id),js=jornadasL(cat),EQ=n=>n===eq;
  let body="";
  if(!js)body=`<p class="empty">Cargando…</p>`;
  else{
    const hoy=hoyISO();
    // partidos del Juncal con fecha; el siguiente = primero cuya fecha es hoy o futura y aún sin resultado; el último = último con resultado
    const mios=[];js.forEach(j=>(j.partidos||[]).forEach(p=>{if(EQ(p.local)||EQ(p.visitante))mios.push({...p,n:j.n})}));
    const jug=mios.filter(p=>p.ga!=null),prox=mios.filter(p=>p.ga==null&&p.fecha&&p.fecha>=hoy).sort((a,b)=>(a.fecha+(a.hora||"99")).localeCompare(b.fecha+(b.hora||"99")))[0];
    const desc=js.find(j=>EQ(j.descansa)&&(j.partidos||[]).some(p=>p.fecha>=hoy)&&(!prox||j.partidos.find(p=>p.fecha).fecha<=prox.fecha));
    if(desc&&(!prox||desc.partidos.find(p=>p.fecha).fecha<prox.fecha))
      body=`<div class="rest2"><span>😴</span>${esc(eq)} descansa en la jornada ${desc.n}<div class="loc">${esc(fecha(desc.partidos.find(p=>p.fecha).fecha,""))}</div></div>`;
    else if(prox){
      const lleno=prox.hora&&prox.campo;
      body=`<div class="vs"><div>${escL(prox.local)}<div class="cn">${esc(prox.local)}</div></div><div class="mid">VS</div><div>${escL(prox.visitante)}<div class="cn">${esc(prox.visitante)}</div></div></div>
      <div class="when"><span>${esc(fecha(prox.fecha,prox.hora))}</span></div>
      <div class="loc">Jornada ${prox.n}${prox.campo?` · <a href="${campoUrl(prox.campo)}" target="_blank" rel="noopener">📍 ${esc(campoTxt(prox.campo))}</a>`:""}</div>`
      +(lleno?"":`<div class="pend">⏳ Pendiente de ${!prox.hora&&!prox.campo?"hora y pabellón":!prox.hora?"hora":"pabellón"}<small>Te avisaremos en cuanto el Ayuntamiento lo publique</small></div>`);
    }else body=`<p class="empty">Sin próximos partidos por ahora</p>`;
    const u=jug.sort((a,b)=>b.n-a.n)[0];
    if(u){const juncalL=EQ(u.local),mio=juncalL?u.ga:u.gb,rv=juncalL?u.gb:u.ga,k=mio>rv?"w":mio<rv?"l":"d";
      body+=`<div class="last"><span class="pill ${k}">${k==="w"?"Victoria":k==="l"?"Derrota":"Empate"}</span><span class="r">J${u.n}: ${esc(u.local)} <b>${u.ga} - ${u.gb}</b> ${esc(u.visitante)}${u.man?' <small>(anotado por el club)</small>':""}</span></div>`}
  }
  return `<section class="card loc2"><div class="ch"><h2>${esc(nombre)}<small>${esc(eq)} · Competición local</small></h2>
   <button class="bell ${on?"on":""}" data-id="${id}" aria-label="Avisos de ${esc(nombre)} local, ${esc(eq)}" aria-pressed="${on}">${on?"🔔":"🔕"}</button></div>${body}
   <div class="row"><a class="p" href="local-categoria.html?c=${cat}">Jornadas y clasificación</a></div></section>`;
}
function card(c){
  const [id,nombre,file]=c,p=px.find(x=>x.id===id),on=av.includes(id);
  let body;
  if(!p)body=`<p class="empty">Sin próximos partidos por ahora</p>`;
  else{
    const own=p.casa?"L":"V";
    body=`<div class="vs"><div>${escudo(p.codLocal,own==="L")}<div class="cn">${esc(p.local)}</div></div><div class="mid">VS</div><div>${escudo(p.codVisitante,own==="V")}<div class="cn">${esc(p.visitante)}</div></div></div>
    <div class="when"><span>${esc(fecha(p.fecha,p.hora))}</span></div>
    <div class="loc">Jornada ${p.jornada} · ${p.casa?"Juegas en casa":"Juegas fuera"}${p.campo?` · <a href="${mapa(p.campo)}" target="_blank" rel="noopener">📍 ${esc(p.campo)}</a>`:""}</div>`;
    const u=p.ultimo;
    if(u){
      const mio=u.casa?u.gl:u.gv,rv=u.casa?u.gv:u.gl,k=mio>rv?"w":mio<rv?"l":"d";
      body+=`<div class="last"><span class="pill ${k}">${k==="w"?"Victoria":k==="l"?"Derrota":"Empate"}</span><span class="r">J${u.jornada}: ${esc(u.local)} <b>${u.gl} - ${u.gv}</b> ${esc(u.visitante)}</span></div>`;
    }
  }
  return `<section class="card"><div class="ch"><h2>${esc(nombre)}<small>${p?esc(p.liga||""):"Escuela Torrejón Juncal"}</small></h2>
   <button class="bell ${on?"on":""}" data-id="${id}" aria-label="Avisos de ${esc(nombre)}" aria-pressed="${on}">${on?"🔔":"🔕"}</button></div>${body}
   <div class="row"><a class="p" href="Categorias/${file}.html">Partidos y clasificación</a></div></section>`;
}
function pinta(){
  // primero los equipos con avisos activados
  const o=CATS.slice().sort((a,b)=>(av.includes(b[0])-av.includes(a[0])));
  const nF=CATS.filter(c=>av.includes(c[0])).length,nL=LOCAL.filter(c=>av.includes(c[0])).length;
  $("#tabs").innerHTML=`<button data-t="fed" class="${tab==="fed"?"on":""}">🏆 Federados${nF?`<span class="n">${nF}</span>`:""}</button><button data-t="loc" class="${tab==="loc"?"on":""}">⚽ Local${nL?`<span class="n">${nL}</span>`:""}</button>`;
  $("#lista").innerHTML=tab==="fed"?o.map(card).join(""):(LOCAL.length?LOCAL.slice().sort((a,b)=>(av.includes(b[0])-av.includes(a[0]))).map(cardL).join(""):`<p class="empty" style="color:#fff">Cargando competición local…</p>`);
  const opt=c=>`<label class="opt"><input type="checkbox" data-id="${c[0]}" ${av.includes(c[0])?"checked":""}> ${esc(c[1])}</label>`;
  $("#ops").innerHTML=`<div class="grp">Federados</div>`+CATS.map(opt).join("")+`<div class="grp">Competición local</div>`+LOCAL.map(c=>opt([c[0],c[1]+" · "+c[3]])).join("");
}
async function aviso(id,on){
  const f=FM();
  if(!f){av=on?[...new Set([...av,id])]:av.filter(x=>x!==id);LS.set("jb_av",JSON.stringify(av));
    toast("Tu elección se ha guardado, pero los avisos solo funcionan en la app de Android.");return true}
  try{
    if(on){
      let p=await f.checkPermissions();
      if(p.receive!=="granted")p=await f.requestPermissions();
      if(p.receive!=="granted"){toast("Activa las notificaciones de la app en los ajustes del móvil para recibir avisos.");return false}
      await f.subscribeToTopic({topic:"juncal-"+id});
    }else await f.unsubscribeFromTopic({topic:"juncal-"+id});
    av=on?[...new Set([...av,id])]:av.filter(x=>x!==id);LS.set("jb_av",JSON.stringify(av));return true;
  }catch(e){toast("No se pudo cambiar el aviso. Comprueba tu conexión e inténtalo de nuevo.");return false}
}
async function cambiar(ids,on){
  for(const id of ids){if(on===av.includes(id))continue;if(!(await aviso(id,on)))break}
  pinta();
}
$("#lista").addEventListener("click",e=>{const b=e.target.closest(".bell");if(b)cambiar([b.dataset.id],!av.includes(b.dataset.id))});
$("#ops").addEventListener("change",async e=>{const i=e.target;if(i.dataset.id){await cambiar([i.dataset.id],i.checked)}});
$("#bAv").onclick=()=>$("#sh").classList.add("on");
$("#bCerrar").onclick=()=>$("#sh").classList.remove("on");
$("#sh").addEventListener("click",e=>{if(e.target.id==="sh")$("#sh").classList.remove("on")});
const TODOS=()=>[...CATS,...LOCAL].map(c=>c[0]);
$("#bTodos").onclick=()=>cambiar(TODOS(),true);
$("#bNing").onclick=()=>cambiar(TODOS(),false);
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;LS.set("jb_tab",tab);pinta();scrollTo({top:0})});

async function carga(){
  let d=null;
  try{
    const r=await fetch(FB+"/juncal.json",{cache:"no-store"});
    if(!r.ok)throw 0;
    let raw=await r.json();d=typeof raw==="string"?JSON.parse(raw):(raw||{});
    const px0=d.px||{};LS.set("jb_px",JSON.stringify({a:px0.actualizado||"",p:px0.partidos||[]}));
    px=px0.partidos||[];$("#upd").textContent="Actualizado "+(px0.actualizado?new Date(px0.actualizado).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Madrid"}):"");
  }catch(e){
    try{const c=JSON.parse(LS.get("jb_px")||"null");if(c){px=c.p;$("#upd").textContent="Sin conexión · datos guardados"}else $("#upd").textContent="Sin conexión"}catch(_){$("#upd").textContent="Sin conexión"}
  }
  if(!FM()){const n=$("#inf");n.hidden=false;n.innerHTML="Estás viendo la web. Los <b>avisos</b> solo llegan si usas la <b>app de Android</b>."}
  pinta();
}
function armaLocal(){
  LOCAL=[];LCATS.forEach(([cat,nom])=>{const d=LD[cat];if(!d)return;const eqs=new Set();
    (d.jornadas||[]).forEach(j=>{(j.partidos||[]).forEach(p=>{[p.local,p.visitante].forEach(n=>{if(ESJ(n))eqs.add(n)})});if(ESJ(j.descansa))eqs.add(j.descansa)});
    [...eqs].sort().forEach(n=>LOCAL.push(["local-"+cat+"-"+nrm(n),nom,cat,n]))});
}
async function cargaLocal(){
  try{
    const fr=await Promise.all(LCATS.map(c=>fetch("datos-local/"+c[0]+".json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).catch(()=>fetch("https://torrejonjuncal.es/datos-local/"+c[0]+".json",{cache:"no-store"}).then(r=>r.json()))));
    LCATS.forEach((c,i)=>{LD[c[0]]=fr[i];LS.set("jb_loc_"+c[0],JSON.stringify(fr[i]))});
  }catch(e){LCATS.forEach(c=>{if(!LD[c[0]]){try{const x=JSON.parse(LS.get("jb_loc_"+c[0])||"null");if(x)LD[c[0]]=x}catch(_){}}})}
  armaLocal();
  try{const r=await fetch(FB+"/local_res.json",{cache:"no-store"});LR=(await r.json())||{}}catch(e){}
  pinta();
}
// Si la app ya tenía avisos elegidos, se reafirman las suscripciones (por si el móvil las perdió al reinstalar)
(async()=>{const f=FM();if(!f||!av.length)return;try{const p=await f.checkPermissions();if(p.receive==="granted")for(const id of av)await f.subscribeToTopic({topic:"juncal-"+id})}catch(e){}})();
carga();cargaLocal();
setInterval(carga,5*60*1000);setInterval(cargaLocal,10*60*1000);
</script>
