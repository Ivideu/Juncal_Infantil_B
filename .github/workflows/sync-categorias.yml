name: Sincronizar categorías
on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Id de una sola categoría (opcional, ej. cadete-a)"
        required: false
  schedule:
    - cron: "*/10 * * * *"
concurrency:
  group: sync-categorias
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-categorias.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          SOLO: ${{ github.event.inputs.solo }}
