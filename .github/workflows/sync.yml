name: Sync resultados RFFM
on:
  schedule:
    - cron: "15 6-22 * * 1-5"    # entre semana: cada hora, al minuto 15
    - cron: "*/15 6-22 * * 0,6"  # sábados y domingos: cada 15 minutos
    # El script solo actúa de 8:00 a 23:59 hora de Madrid (la hora de las cron es UTC)
  workflow_dispatch:           # ejecución manual = revisión completa de las 22 jornadas
concurrency:
  group: sync-rffm
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SOLO_CERRADAS: "1"     # "1" = solo guarda resultados con el acta cerrada; "0" = en cuanto aparezcan