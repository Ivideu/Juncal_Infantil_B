name: Deshacer duplicados de la recuperación de Infantil B

# Quita de Firebase solo los datos con dorsal (p. ej. «1-Rubén», «2-Manu» en goles) que añadió por error la recuperación del 21/11.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/deshacer-recuperacion.yml"]
    branches: [main]
concurrency:
  group: sync-semana
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deshacer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FBKEY: ${{ secrets.FBKEY }}
      FBMAIL: ${{ secrets.FBMAIL }}
      FBPASS: ${{ secrets.FBPASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copia del estado actual
        run: node scripts/verificar-goles.mjs copia juncal "Backup/juncal-antes-de-deshacer-$(date -u +%Y%m%d-%H%M).json"
      - name: Deshacer
        run: node scripts/deshacer-recuperacion.mjs juncal Backup/juncal-antes-de-recuperar-20261121-1246.json Backup/juncal-datos-aportados-20261121.json 2>&1 | tee /tmp/informe.txt
      - name: Guardar informe
        if: always()
        run: |
          { echo "Deshacer recuperación — $(date -u +%FT%TZ)"; echo; cat /tmp/informe.txt; } > Backup/deshacer-informe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backup
          git diff --cached --quiet && exit 0
          git commit -q -m "Deshacer duplicados de la recuperación: informe"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
