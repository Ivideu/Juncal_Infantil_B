name: Buscar logos de patrocinadores
# Descarga candidatos de logo de las webs de los patrocinadores a logos-candidatos/ (solo para revisar). Manual.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/buscar_logos.mjs
      - name: Guardar candidatos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f logos-candidatos
          git commit -m "Candidatos de logos de patrocinadores" || exit 0
          git pull --rebase -X theirs -q origin main
          git push
