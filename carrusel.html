<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenadores Juncal · Carrusel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ye:#ffd23f;--navy:#0f2a6b;--sh:0 1px 4px rgba(8,18,53,.75),0 0 14px rgba(8,18,53,.45)}
*{box-sizing:border-box;margin:0}
html{background:#0f2a78}
body{min-height:100vh;color:#0f1b3d;background:transparent;font:16px/1.5 Barlow,system-ui,sans-serif}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(8,18,53,.22),rgba(8,18,53,.22)),linear-gradient(90deg,#f2b705 0%,#ffd23f 18%,#ffe98f 30%,#dbe8ff 42%,#5b9bff 58%,#1e4fd8 78%,#0f2a78 100%),#0f2a78}
.wrap{max-width:980px;margin:auto;padding:0 16px}
section{padding:60px 0}
h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;line-height:1;margin-bottom:10px;color:#fff;font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800;letter-spacing:.02em;text-shadow:var(--sh)}
h2 span{color:var(--ye);text-shadow:0 2px 0 #0f2a78,0 0 3px #0f2a78,0 0 14px rgba(8,18,53,.5)}
.sub{max-width:620px;margin-bottom:30px;color:#fff;text-shadow:var(--sh)}
/* Carrusel (mismo patrón que Próximos partidos) */
.car{position:relative;--g:2px}
.trk{display:flex;gap:14px;padding:8px var(--g) 16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--g);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.cs{display:block;padding:0;border:0;background:none;cursor:pointer;scroll-snap-align:start}
.cs img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(8,18,53,.35))}
.ar{position:absolute;top:42%;z-index:3;display:grid;place-items:center;width:54px;height:54px;padding:0 0 4px;border:3px solid var(--navy);border-radius:50%;color:var(--navy);background:#fff;box-shadow:0 6px 20px rgba(8,18,53,.6);font-size:2.2rem;font-weight:700;line-height:1;cursor:pointer;transition:background-color .2s,opacity .2s}
.ar:hover{background:var(--ye);animation:none}
.ar.l{left:-26px}.ar.r{right:-26px}
.ar:disabled{opacity:0;pointer-events:none}
.ar:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ar.r:not(:disabled){animation:nR 1.5s ease-in-out infinite}
.ar.l:not(:disabled){animation:nL 1.5s ease-in-out infinite}
@keyframes nR{0%,100%{transform:translateX(0);box-shadow:0 6px 20px rgba(8,18,53,.6),0 0 0 0 rgba(255,210,63,.8)}50%{transform:translateX(7px);box-shadow:0 6px 20px rgba(8,18,53,.6),0 0 0 12px rgba(255,210,63,0)}}
@keyframes nL{0%,100%{transform:translateX(0);box-shadow:0 6px 20px rgba(8,18,53,.6),0 0 0 0 rgba(255,210,63,.8)}50%{transform:translateX(-7px);box-shadow:0 6px 20px rgba(8,18,53,.6),0 0 0 12px rgba(255,210,63,0)}}
@media(max-width:1040px){.ar.l{left:-8px}.ar.r{right:-8px}}
@media(max-width:800px){.car{margin:0 calc(50% - 50vw);--g:16px}.ar{width:46px;height:46px;font-size:1.9rem}.ar.l{left:8px}.ar.r{right:8px}}
/* Visor ampliado */
#ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,18,53,.78);backdrop-filter:blur(6px);animation:in .2s both}
@keyframes in{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.m{position:relative;max-width:min(92vw,420px);padding:14px;border-radius:20px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.2,1.3,.4,1) both}
.m img{display:block;max-width:100%;max-height:76vh;height:auto;margin:0 auto;border-radius:14px}
.m .x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:0;border-radius:50%;color:#0a0f1e;background:var(--ye);font-size:1.4rem;cursor:pointer}
.cs{flex:0 0 calc((100% - 28px)/3)}
@media(max-width:800px){.cs{flex-basis:calc((100% - 14px)/2.3)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="bg" aria-hidden="true"></div>
<section><div class="wrap">
<h2>Entrenadores <span>Juncal</span></h2>
<p class="sub">El equipo técnico encargado de formar, acompañar y hacer crecer a nuestros jugadores.</p>
<div class="car" id="car">
<button class="ar l" id="prev" type="button" aria-label="Anterior">‹</button>
<div class="trk" id="trk" tabindex="0" aria-label="Entrenadores Juncal, desliza para ver más"></div>
<button class="ar r" id="next" type="button" aria-label="Siguiente">›</button>
</div></div></section>
<script>
const ENTRENADORES=[
 {name:"",role:"",img:"./Images/Entrenadores/Javier2.png"},
 {name:"",role:"",img:"./Images/Entrenadores/Antonio.png"},
 {name:"",role:"",img:"./Images/Entrenadores/JoseEntrenador.png"},
 {name:"",role:"",img:"./Images/Entrenadores/Alberto.png"},
 {name:"",role:"",img:"./Images/Entrenadores/Carlos.png"},
 {name:"",role:"",img:"./Images/Entrenadores/Dani.png"},
 {name:"",role:"",img:"./Images/Entrenadores/Ivan.png"}
 /* añade aquí los 4 que faltan: el carrusel se adapta solo */
];
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const trk=$("#trk");
trk.innerHTML=ENTRENADORES.map((p,i)=>`<button type="button" class="cs" data-i="${i}" aria-label="Entrenador ${i+1}: ver ampliado"><img src="${esc(p.img)}" alt="Entrenador del Torrejón Juncal" loading="lazy"></button>`).join("");
function closeOv(){const o=$("#ov");if(o)o.remove();document.body.style.overflow=""}
function openOv(i){const p=ENTRENADORES[i];if(!p)return;closeOv();const o=document.createElement("div");o.id="ov";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Entrenador");
 o.innerHTML=`<div class="m"><button class="x" type="button" aria-label="Cerrar">×</button><img src="${esc(p.img)}" alt="Entrenador del Torrejón Juncal"></div>`;
 o.onclick=e=>{if(e.target===o||e.target.classList.contains("x"))closeOv()};document.body.appendChild(o);document.body.style.overflow="hidden";o.querySelector(".x").focus()}
addEventListener("keydown",e=>{if(e.key==="Escape")closeOv()});
function flechas(){$("#prev").disabled=trk.scrollLeft<=2;$("#next").disabled=trk.scrollLeft>=trk.scrollWidth-trk.clientWidth-2}
$("#prev").onclick=()=>trk.scrollBy({left:-trk.clientWidth*.8,behavior:"smooth"});
$("#next").onclick=()=>trk.scrollBy({left:trk.clientWidth*.8,behavior:"smooth"});
trk.addEventListener("scroll",flechas,{passive:true});addEventListener("resize",flechas);
trk.addEventListener("click",e=>{const c=e.target.closest(".cs");if(c)openOv(+c.dataset.i)});
flechas();
</script></body></html>
