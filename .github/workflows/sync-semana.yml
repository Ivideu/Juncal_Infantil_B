name: Sincronizar semana

# Un solo workflow para todo: sincroniza las categorías (sync-categorias.mjs) y actualiza
# los próximos partidos (proximos.mjs). Sin schedule: lo lanza el cron-job externo
# vía workflow_dispatch.
# Manual: marca «completa» para leer TODAS las jornadas (tarda ~25 min con las 10 categorías).
on:
  workflow_dispatch:
    inputs:
      completa:
        description: "Leer TODAS las jornadas (lento) en lugar de actual y siguiente"
        type: boolean
        default: false
      solo:
        description: "Id de una sola categoría (opcional, ej. cadete-a o infantil-b)"
        required: false

concurrency:
  group: sync-semana
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FBKEY: ${{ secrets.FBKEY }}
      FBMAIL: ${{ secrets.FBMAIL }}
      FBPASS: ${{ secrets.FBPASS }}
      RAPIDO: ${{ github.event.inputs.completa == 'true' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar categorías
        id: categorias
        continue-on-error: true
        env:
          SOLO: ${{ github.event.inputs.solo }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}   # avisos push (tema juncal-<id>)
        run: node scripts/sync-categorias.mjs

      - name: Próximos partidos
        id: proximos
        if: ${{ github.event.inputs.solo == '' }}   # si pruebas una sola categoría, se omite
        continue-on-error: true
        run: node scripts/proximos.mjs

      - name: Comprobar resultado
        if: ${{ steps.categorias.outcome == 'failure' || steps.proximos.outcome == 'failure' }}
        run: |
          echo "::error::categorías: ${{ steps.categorias.outcome }} · próximos partidos: ${{ steps.proximos.outcome }}"
          exit 1