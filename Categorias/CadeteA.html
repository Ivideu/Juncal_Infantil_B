<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="../../css/fondojuncal.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juncal A · Primera Cadete FS · Grupo 2 · 2026-27</title>
<link rel="icon" type="image/png" sizes="192x192" href="../../Images/icon-192.png">
<link rel="apple-touch-icon" href="../../Images/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juncal_Cade.A">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../../css/bloque.css">
<link rel="stylesheet" href="../../css/efecto3d.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ff;--bg2:#ffffff;--card:rgba(255,255,255,.86);--line:#d5def5;--tx:#0f1b3d;--mu:#5a6a93;--ac:#2f7bff;--ye:#ffd23f;--ye2:#d97706}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:40px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
h1,h2,.cn{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
.wrap{max-width:980px;margin:auto;padding:0 16px}
/* Fondo animado */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#f4f8ff,#e6efff 55%,#fff7e0)}
#bg i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.6;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
#bg i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:#8bbcff}
#bg i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:8vh;background:#ffe48a;animation-duration:30s;animation-delay:-8s}
#bg i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-24vmax;background:#a6f1c8;animation-duration:27s;animation-delay:-14s}
#bg i:nth-child(4){width:34vmax;height:34vmax;right:12vw;bottom:-10vmax;background:#c7b8ff;animation-duration:34s;animation-delay:-4s;opacity:.45}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.15)}100%{transform:translate(-6vw,12vh) scale(.95)}}
#bg b{position:absolute;bottom:-70px;font-weight:400;opacity:.2;will-change:transform;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(720deg)}}
/* Cabecera panorámica */
header.site-banner{position:relative;width:100%;margin:0 auto 18px;aspect-ratio:1347/375;overflow:hidden;border-radius:16px;background-color:#050b1f;background-image:linear-gradient(180deg,transparent 65%,rgba(5,11,31,.45) 100%),url('../../Images/cabecera-juncal.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;border-bottom:2px solid #2f7bff;box-shadow:0 8px 28px rgba(0,40,120,.35)}
header.site-banner h1{position:absolute;inset:0;font-size:0;line-height:0;color:transparent}
@media(max-width:600px){header.site-banner{border-radius:12px}}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:8px 14px;border-radius:10px;transition:.2s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* Portada */
#hero{--tx:#eef2ff;--mu:#c3d0ff;color:#fff;margin:18px 0;padding:26px;border-radius:22px;background:linear-gradient(135deg,#3d8bff,#1e4fd8 55%,#0f2a78);border:1px solid #7aa9ff;box-shadow:0 14px 40px #1e4fd833;position:relative;overflow:hidden}
#hero>*{position:relative;z-index:1}
#hero:after{pointer-events:none;content:"⚽";position:absolute;right:-20px;bottom:-50px;font-size:200px;opacity:.1;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hv{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:14px 0;text-align:center}
.hv .cn{font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:700;max-width:220px}
.cd{display:flex;gap:10px;justify-content:center}.cd div{background:#0a1f5a66;border-radius:12px;padding:8px 14px;min-width:64px;text-align:center}
.cd b{font:800 2rem 'Barlow Condensed';display:block;line-height:1}.cd span{font-size:.75rem;color:var(--mu)}
.dt{background:var(--ye);color:#0a0f1e;font-weight:800;padding:2px 10px;border-radius:6px}
.dtb{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.4rem,5.2vw,2.5rem);padding:6px 22px;border-radius:12px;line-height:1.2;box-shadow:0 6px 24px #ffd23f55}
.loc{text-align:center;margin:0 0 16px}.loc a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}.loc a:hover{color:var(--ye)}
/* Pestañas */
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0 14px;justify-content:center}
nav button{font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;min-width:0;text-align:center;line-height:1.15;font-size:clamp(.7rem,3vw,.95rem)}
nav button span:first-child{font-size:1.3rem}
/* Escudos */
.b{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font:800 1rem 'Barlow Condensed';color:#fff;flex:none;border:2px solid #fff;box-shadow:0 2px 8px #0f1b3d33}
.b img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px #0f1b3d55)}
.b.ok{background:transparent!important;border-color:transparent;box-shadow:none;color:transparent}
.hv .b{width:64px;height:64px;font-size:1.4rem}
/* Partidos */
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 18px #1e4fd814;animation:in .5s both;animation-delay:calc(var(--i)*30ms)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card.me{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 8px 30px #2f7bff29}
.card.rw{background:linear-gradient(#22c55e38,#22c55e22),var(--card);border-color:#22c55e}
.card.rd{background:linear-gradient(#fde68a66,#fde68a40),var(--card);border-color:#e9c94f}
.card.rl{background:linear-gradient(#f8717140,#f8717126),var(--card);border-color:#f87171}
.card.rest{opacity:.65}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.top b{color:var(--ye2);font-family:'Barlow Condensed';font-size:1.1rem}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tm{display:flex;align-items:center;gap:10px;font-weight:600;line-height:1.2}
.tm.r{flex-direction:row-reverse;text-align:right}
.sc{font:800 1.8rem 'Barlow Condensed';background:#e3ebff;color:var(--tx);border-radius:10px;padding:2px 14px;min-width:88px;text-align:center}
.sc.t{font-size:1.3rem;color:var(--ac)}
.w{background:#22c55e2e;color:#15803d}.l{background:#ef44442e;color:#b91c1c}.d{background:#f59e0b2e;color:#b45309}
.pill{font:700 .8rem 'Barlow Condensed';padding:1px 10px;border-radius:99px;letter-spacing:.05em}
.meta{margin-top:10px;font-size:.88rem;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:#1d5fe0}
@media(max-width:560px){.tm{flex-direction:column;text-align:center!important;gap:4px;font-size:.85rem}.sc{min-width:70px;font-size:1.5rem}.b{width:38px;height:38px}.hv .b{width:56px;height:56px}}
/* Clasificación */
table{width:100%;border-collapse:collapse;background:var(--card);backdrop-filter:blur(8px);border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #1e4fd814}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:500;font-size:.8rem;background:#e9f0ff}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{background:#2f7bff26;font-weight:700}
.gap{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
/* Selector de jornada */
.jsel{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;max-width:420px}
.jsel select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;font:700 1rem Barlow,system-ui,sans-serif;color:var(--tx);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%232f7bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 14px center/12px;border:2px solid var(--ac);border-radius:12px;padding:10px 38px 10px 16px;text-align:center;text-align-last:center;cursor:pointer;box-shadow:0 4px 18px #2f7bff29}
.jsel button{flex:none;width:44px;height:44px;padding:0;font-size:1.5rem;line-height:1;font-weight:700;border-radius:12px}
.jsel button:disabled{opacity:.35;cursor:default;transform:none}
/* Caja azul final con botón Volver */
.volver{margin:36px 0 10px;padding:24px 18px;border-radius:22px;text-align:center;color:#fff;background:linear-gradient(135deg,#3d8bff,#1e4fd8 55%,#0f2a78);border:1px solid #7aa9ff;box-shadow:0 14px 40px #1e4fd833}
.volver p{margin-bottom:14px;font-weight:600}
.volver button{background:var(--ye);color:#0a0f1e;border:0;font-weight:800;font-size:1.05rem;padding:12px 30px;border-radius:12px;box-shadow:0 4px 14px rgba(8,18,53,.35)}
.volver button:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
<header class="site-banner"><h1>Escuela Torrejón Juncal A</h1></header>
<section id="hero"></section>
<nav id="nav"></nav>
<main id="app"></main>
<div class="volver">
 <p>¿Quieres ver otra categoría?</p>
 <button type="button" onclick="volver()">← Volver</button>
</div>
</div>
<script>
(function(){const b=document.getElementById("bg");for(let i=0;i<9;i++){const e=document.createElement("b");e.textContent="⚽";e.style.cssText="left:"+((i*11+Math.random()*8)%100)+"%;font-size:"+(22+Math.random()*34)+"px;animation-duration:"+(18+Math.random()*20)+"s;animation-delay:-"+(Math.random()*30)+"s";b.appendChild(e)}})();

/* =====================================================================
   CONFIGURACIÓN DE LA CATEGORÍA (de categorias.json)
   ===================================================================== */
const CAT={nombre:"Torrejón Juncal A",liga:"Primera Cadete FS · Grupo 2",grupo:"27435112",equipo:"19691126",node:"cat-cadete-a"};
const FB="https://juncal-f0b64-default-rtdb.europe-west1.firebasedatabase.app";
/* Datos que llegan de la sincronización con la RFFM (Firebase, nodo CAT.node), en el mismo formato que Infantil B:
   S.cfg = {T:{id:[nombre,pabellón]}, COD:{id:CodEquipo}, R:["dd-mm-aaaa|local-visitante,..."]}
   S.m   = {"jornada_local":{h,a,d,t,p}}   */
let S={u:0,m:{}},T={},COD={},J=[],ME=0,loading=true,tab="jor",jn=1,jnAuto=true;
try{const c=JSON.parse(localStorage.getItem(CAT.node));if(c&&c.u){S=c;loading=false}}catch(e){}
function cfg(){const c=S.cfg||{};S.m=S.m||{};T=c.T||{};COD=c.COD||{};
 J=(c.R||[]).map((s,i)=>{const[d,p]=s.split("|");return{n:i+1,d:d.split("-").reverse().join("-"),p:p.split(",").map(x=>x.split("-").map(Number))}});
 ME=+Object.keys(COD).find(k=>String(COD[k])===String(c.equipo||CAT.equipo))||0}
cfg();
function apply(n){S=n;cfg();loading=false;try{localStorage.setItem(CAT.node,JSON.stringify(S))}catch(e){}render()}
(function(){const l=document.createElement("link");l.rel="preconnect";l.href=FB;document.head.appendChild(l);
 try{const es=new EventSource(FB+"/"+CAT.node+".json");
  es.addEventListener("put",ev=>{let m,n;try{m=JSON.parse(ev.data);if(m.path!=="/")return;n=m.data==null?{u:0,m:{}}:(typeof m.data==="string"?JSON.parse(m.data):m.data)}catch(e){return}apply(n)})}catch(e){}
 setTimeout(()=>{if(loading){loading=false;render()}},8000)})();

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>{const s=new Date(d+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});return s[0].toUpperCase()+s.slice(1)};
const M=(j,h)=>(S.m&&S.m[j+"_"+h])||{};
const done=m=>m.h!==undefined&&m.h!==""&&m.a!==undefined&&m.a!=="";
const bd=id=>{if(!id||!T[id])return`<span class="b" style="background:#334">💤</span>`;const n=T[id][0].split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();return`<span class="b" style="background:${id==ME?'#2f7bff':`hsl(${id*47%360} 55% 38%)`}">${n}${COD[id]?`<img src="../../Escudos/${COD[id]}.png" alt="" onload="this.parentNode.classList.add('ok')" onerror="this.remove()">`:""}</span>`};
const nm=id=>!id||!T[id]?"Descansa":id==ME?CAT.nombre:T[id][0];
const ven=(h,m)=>{const p=m&&m.p;if(!p)return(T[h]&&T[h][1])||"";return p.toLowerCase().replace(/(^|[\s.\-(])([a-zñ])/g,(_,a,b)=>a+b.toUpperCase())};
const loc=(h,m)=>{const v=ven(h,m);return v?`📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}">${esc(v)}</a>`:""};
function madrid(d,t){const[y,mo,da]=d.split("-").map(Number),[h,mi]=t.split(":").map(Number),g=Date.UTC(y,mo-1,da,h,mi||0);
 const off=z=>{const p=new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Madrid",hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"}).formatToParts(new Date(z)).reduce((o,x)=>(o[x.type]=+x.value,o),{});return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-z};
 return g-off(g-off(g))}
const when=x=>{const m=M(x.r.n,x.h);return new Date(madrid(m.d||x.r.d,m.t||"23:59"))};
const myM=()=>{if(!ME)return[];const l=[];J.forEach(r=>{const p=r.p.find(q=>q.includes(ME));if(p)l.push({r,h:p[0],a:p[1]})});
 const f=z=>{const m=M(z.r.n,z.h);return(m.d||z.r.d)+"T"+(m.t||"23:59")};return l.sort((x,y)=>f(x)<f(y)?-1:f(x)>f(y)?1:0)};
const cur=x=>!done(M(x.r.n,x.h))&&when(x)>=new Date(Date.now()-864e5);
const nextL=()=>myM().filter(x=>x.h&&x.a).find(cur);
function table(){const t={};for(const id in T)t[id]={id,pj:0,g:0,e:0,p:0,gf:0,gc:0};
 J.forEach(r=>r.p.forEach(([h,a])=>{if(!h||!a||!t[h]||!t[a])return;const m=M(r.n,h);if(!done(m))return;const x=+m.h,y=+m.a,A=t[h],B=t[a];A.pj++;B.pj++;A.gf+=x;A.gc+=y;B.gf+=y;B.gc+=x;if(x>y){A.g++;B.p++}else if(x<y){B.g++;A.p++}else{A.e++;B.e++}}));
 return Object.values(t).map(o=>({...o,pts:o.g*3+o.e,dg:o.gf-o.gc})).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||T[a.id][0].localeCompare(T[b.id][0]))}
function card(r,h,a,i){
 const m=M(r.n,h),d=m.d||r.d,me=h==ME||a==ME,pl=done(m);
 if(!h||!a){const id=h||a;return`<div class="card rest ${id==ME?'me':''}" style="--i:${i}"><div class="top"><span>${id==ME?`<b>Jornada ${r.n}</b> · <span class="dt">${fmt(r.d)}</span>`:nm(id)}</span></div><div class="tm">${bd(0)} Descansa esta jornada</div></div>`}
 let pill="",rc="";
 if(me&&pl){const g=h==ME?m.h-m.a:m.a-m.h;rc=g>0?"rw":g<0?"rl":"rd";pill=g>0?`<span class="pill w">VICTORIA</span>`:g<0?`<span class="pill l">DERROTA</span>`:`<span class="pill d">EMPATE</span>`}
 const mid=pl?`${m.h} - ${m.a}`:(m.t||"–:–");
 return`<div class="card ${me?'me':''} ${rc}" style="--i:${i}"><div class="top"><span>${me?`<b>Jornada ${r.n}</b> · <span class="dt">${fmt(d)}${m.t?" · "+esc(m.t)+" h":""}</span>`:fmt(d)}</span>${pill}</div>
 <div class="mt"><div class="tm">${bd(h)}${esc(nm(h))}</div><div class="sc ${pl?'':'t'}">${esc(mid)}</div><div class="tm r">${bd(a)}${esc(nm(a))}</div></div>
 ${me?`<div class="meta"><span>${loc(h,m)}</span>${!m.t&&!pl?"<span>⏳ Hora por confirmar</span>":""}</div>`:""}</div>`}
function hero(){
 if(!ME||!J.length)return`<h2 style="font-size:1.8rem">Calendario pendiente</h2><p>En cuanto se publique el calendario de ${esc(CAT.liga)} aparecerán aquí los partidos.</p>`;
 const nx=nextL();if(!nx)return`<h2 style="font-size:1.8rem">Temporada finalizada 🏆</h2><p>No quedan partidos por jugar.</p>`;
 const m=M(nx.r.n,nx.h);
 return`<div class="cn" style="font-size:1.1rem;color:var(--ye)">PRÓXIMO PARTIDO · JORNADA ${nx.r.n}</div>
 <div class="hv"><div>${bd(nx.h)}<div class="cn">${esc(nm(nx.h))}</div></div><div class="cn" style="font-size:2rem">VS</div><div>${bd(nx.a)}<div class="cn">${esc(nm(nx.a))}</div></div></div>
 <p style="text-align:center;margin-bottom:18px"><span class="dt dtb">${fmt(m.d||nx.r.d)} · ${m.t?esc(m.t)+" h":"hora por confirmar"}</span></p>
 <p class="loc">${loc(nx.h,m)}</p>
 ${m.t?`<div class="cd" id="cd" data-t="${when(nx).getTime()}"></div>`:""}`}
function tick(){const e=document.getElementById("cd");if(!e)return;let s=Math.max(0,(+e.dataset.t-Date.now())/1e3|0);const v=[[86400,"días"],[3600,"horas"],[60,"min"],[1,"seg"]];e.innerHTML=v.map(([k,l])=>{const n=s/k|0;s%=k;return`<div><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`}).join("")}
function jsel(){const c=(nextL()||{r:{n:0}}).r.n;
 return`<div class="jsel"><button aria-label="Jornada anterior" ${jn<=1?"disabled":""} onclick="jn=${jn-1};jnAuto=false;render()">‹</button><select aria-label="Elegir jornada" onchange="jn=+this.value;jnAuto=false;render()">${J.map(r=>`<option value="${r.n}" ${jn==r.n?"selected":""}>Jornada ${r.n} · ${r.d.slice(8)}/${r.d.slice(5,7)}${r.n==c?" · actual":""}</option>`).join("")}</select><button aria-label="Jornada siguiente" ${jn>=J.length?"disabled":""} onclick="jn=${jn+1};jnAuto=false;render()">›</button></div>`}
function render(){
 const hr=document.getElementById("hero"),nv=document.getElementById("nav"),ap=document.getElementById("app");
 if(loading){hr.style.display="none";nv.innerHTML="";ap.innerHTML="";return}
 hr.style.display="";hr.innerHTML=hero();tick();
 if(!ME||!J.length){nv.innerHTML="";ap.innerHTML=`<div class="empty">📅 Aún no hay jornadas publicadas.</div>`;return}
 if(jnAuto){const nx=nextL();jn=nx?nx.r.n:J.length}
 const tabs=[["jor","🗓","Jornadas"],["cal","📅","Mi calendario"],["cla","🏆","Clasificación"]];
 nv.innerHTML=tabs.map(([k,ic,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';if(tab=='jor')jnAuto=true;render()"><span>${ic}</span><span>${l}</span></button>`).join("");
 let h="";
 if(tab=="jor")h=jsel()+[...J[jn-1].p].sort((x,y)=>y.includes(ME)-x.includes(ME)).map((p,i)=>card(J[jn-1],p[0],p[1],i)).join("");
 if(tab=="cal")h=myM().map((x,i)=>card(x.r,x.h,x.a,i)).join("");
 if(tab=="cla")h=`<table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr>${table().map((t,i)=>`<tr class="${t.id==ME?'me':''}"><td>${i+1}</td><td>${esc(nm(t.id))}</td><td>${t.pj}</td><td>${t.g}</td><td>${t.e}</td><td>${t.p}</td><td>${t.gf}</td><td>${t.gc}</td><td>${t.dg>0?"+":""}${t.dg}</td><td><b>${t.pts}</b></td></tr>`).join("")}</table>`;
 ap.innerHTML=h}
