name: Sincronizar categorías
on:
  workflow_dispatch:           # ejecución manual = revisión completa de todas las jornadas
    inputs:
      solo:
        description: "Id de una sola categoría (opcional, ej. cadete-a)"
        required: false
  schedule:
    # Una vez por hora, todos los días. Minuto 27 (y no el 0) porque GitHub retrasa o se salta
    # bastantes ejecuciones programadas en punto, que es cuando hay más carga.
    # Va en UTC y cubre invierno y verano; el script solo actúa de 9:00 a 22:59 hora de Madrid.
    - cron: "27 7-21 * * *"
    # --- Alternativa si prefieres que solo corra de sábado a martes (quita el de arriba y activa este) ---
    # - cron: "27 7-21 * * 6,0,1,2"
concurrency:
  group: sync-categorias
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-categorias.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          SOLO: ${{ github.event.inputs.solo }}
          SOLO_CERRADAS: "0"     # "1" = solo resultados con el acta cerrada
          ESPERA_MIN: "100"      # minutos desde el inicio tras los que un partido "en juego" se da por terminado
