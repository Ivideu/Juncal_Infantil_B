name: Sync resultados RFFM
on:
  workflow_dispatch:           # ejecución manual = revisión completa de las 22 jornadas
  schedule:
    - cron: "7 5-22 * * *"    # cada hora, todos los días (en UTC; el script solo actúa de 8:00 a 23:30 hora de Madrid)
concurrency:
  group: sync-rffm
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
        env:
          FBKEY: ${{ secrets.FBKEY }}
          FBMAIL: ${{ secrets.FBMAIL }}
          FBPASS: ${{ secrets.FBPASS }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          SOLO_CERRADAS: "1"     # "1" = solo guarda resultados con el acta cerrada; "0" = en cuanto aparezcan